<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · Teacher Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, border 0.2s;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 10;
    }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.5rem;
    }
    .sidebar-logo i {
      font-size: 1.8rem;
      color: var(--primary);
      background: rgba(42,125,225,0.1);
      padding: 0.6rem;
      border-radius: 14px;
    }
    .sidebar-logo span {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .sidebar-logo span small { color: var(--primary); }
    .sidebar nav { flex: 1; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
      margin-bottom: 0.3rem;
    }
    .sidebar nav a i { width: 1.4rem; }
    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: rgba(42,125,225,0.1);
      color: var(--primary);
    }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: 0.15s;
    }
    .sidebar-footer:hover { color: #e74c3c; }

    /* Main */
    .main {
      flex: 1;
      padding: 1.8rem 2rem 2.5rem;
      overflow-x: hidden;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .navbar h1 { font-size: 1.7rem; font-weight: 700; }
    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .navbar-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-secondary);
      cursor: pointer;
      position: relative;
      transition: 0.15s;
    }
    .navbar-actions button:hover { color: var(--primary); }
    .badge {
      position: absolute;
      top: -6px;
      right: -8px;
      background: #e74c3c;
      color: white;
      font-size: 0.6rem;
      padding: 0.15rem 0.45rem;
      border-radius: 30px;
      font-weight: 700;
    }
    .lang-dark { display: flex; gap: 0.6rem; }
    .lang-dark button {
      background: none;
      border: none;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lang-dark .dark-toggle { color: var(--text-secondary); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.2rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: 0.15s;
    }
    .stat-card .label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .stat-card .value {
      font-size: 1.9rem;
      font-weight: 700;
      margin: 0.4rem 0 0.1rem;
    }
    .stat-card .icon {
      font-size: 1.4rem;
      color: var(--primary);
      opacity: 0.7;
    }
    .row-2col {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .card-panel {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.2rem 1.2rem 1.5rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .card-panel h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .card-panel h3 i { color: var(--primary); }
    .chart-container { height: 180px; }
    .activity-item, .live-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .activity-item i { width: 1.8rem; color: var(--primary); }
    .live-item i { color: #e67e22; }
    .live-item .time {
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .empty-state {
      color: var(--text-secondary);
      text-align: center;
      padding: 1.5rem 0;
      font-size: 0.9rem;
    }

    @media (max-width: 992px) {
      .row-2col { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 1.2rem; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
      .navbar { flex-direction: column; align-items: stretch; }
    }
    .rtl { direction: rtl; }
    .rtl .sidebar nav a { flex-direction: row-reverse; }
    .rtl .navbar-actions { flex-direction: row-reverse; }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>Edu<small>Core</small></span>
    </div>
    <nav>
      <a href="dashboard.html" class="active"><i class="fas fa-chart-pie"></i> <span data-key="dashboard">Dashboard</span></a>
      <a href="courses.html"><i class="fas fa-book-open"></i> <span data-key="courses">Courses</span></a>
      <a href="students.html"><i class="fas fa-users"></i> <span data-key="students">Students</span></a>
      <a href="live-classes.html"><i class="fas fa-video"></i> <span data-key="live">Live Classes</span></a>
      <a href="revenue.html"><i class="fas fa-dollar-sign"></i> <span data-key="revenue">Revenue</span></a>
      <a href="settings.html"><i class="fas fa-cog"></i> <span data-key="settings">Settings</span></a>
    </nav>
    <div class="sidebar-footer" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> <span data-key="logout">Logout</span>
    </div>
  </aside>

  <div class="main" id="mainContent">
    <header class="navbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="navbar-actions">
        <div class="lang-dark">
          <button id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
          <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>
        <button id="notifBtn"><i class="fas fa-bell"></i><span class="badge" id="notifBadge">3</span></button>
        <button><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
      </div>
    </header>

    <section class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="label">Total Students</div><div class="value" id="totalStudents">—</div><i class="fas fa-user-graduate icon"></i></div>
      <div class="stat-card"><div class="label">Total Courses</div><div class="value" id="totalCourses">—</div><i class="fas fa-book icon"></i></div>
      <div class="stat-card"><div class="label">Total Lessons</div><div class="value" id="totalLessons">—</div><i class="fas fa-file-alt icon"></i></div>
      <div class="stat-card"><div class="label">Live Classes</div><div class="value" id="liveClasses">—</div><i class="fas fa-video icon"></i></div>
      <div class="stat-card"><div class="label">Revenue</div><div class="value" id="revenue">—</div><i class="fas fa-dollar-sign icon"></i></div>
    </section>

    <div class="row-2col">
      <div class="card-panel">
        <h3><i class="fas fa-chart-line"></i> <span data-key="analytics">Analytics (last 6 weeks)</span></h3>
        <div class="chart-container"><canvas id="analyticsChart"></canvas></div>
      </div>
      <div class="card-panel">
        <h3><i class="fas fa-clock"></i> <span data-key="recent">Recent Activities</span></h3>
        <div id="recentActivities"><div class="empty-state">Loading activities...</div></div>
      </div>
    </div>

    <div class="card-panel">
      <h3><i class="fas fa-calendar-check"></i> <span data-key="upcoming">Upcoming Live Sessions</span></h3>
      <div id="upcomingLives"><div class="empty-state">Loading sessions...</div></div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { showToast, showLoading, hideLoading } from './shared.js';
    import { initOneSignal } from './onesignal.js';
    import {
      onAuthStateChanged,
      signOut
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';
    import {
      collection,
      getDocs,
      query,
      orderBy,
      limit,
      onSnapshot,
      doc,
      getDoc
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

    // Auth protection
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        console.log('✅ Logged in as:', user.email);
        document.body.classList.add('auth-ready');
        loadDashboardData();
        listenToUpdates();
      }
    });

    const totalStudentsEl = document.getElementById('totalStudents');
    const totalCoursesEl = document.getElementById('totalCourses');
    const totalLessonsEl = document.getElementById('totalLessons');
    const liveClassesEl = document.getElementById('liveClasses');
    const revenueEl = document.getElementById('revenue');
    const recentDiv = document.getElementById('recentActivities');
    const upcomingDiv = document.getElementById('upcomingLives');
    const notifBadge = document.getElementById('notifBadge');
    let chart = null;

    function formatCurrency(amount) {
      return '$' + Number(amount).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    async function loadDashboardData() {
      showLoading();
      try {
        const [studentsSnap, coursesSnap, lessonsSnap, liveSnap, revenueSnap] = await Promise.all([
          getDocs(collection(db, 'students')),
          getDocs(collection(db, 'courses')),
          getDocs(collection(db, 'lessons')),
          getDocs(collection(db, 'liveClasses')),
          getDocs(collection(db, 'transactions'))
        ]);

        totalStudentsEl.textContent = studentsSnap.size;
        totalCoursesEl.textContent = coursesSnap.size;
        totalLessonsEl.textContent = lessonsSnap.size;

        let liveCount = 0;
        liveSnap.forEach(doc => {
          const data = doc.data();
          if (data.status === 'upcoming' || data.status === 'live') liveCount++;
        });
        liveClassesEl.textContent = liveCount;

        let totalRevenue = 0;
        revenueSnap.forEach(doc => {
          const data = doc.data();
          if (data.amount) totalRevenue += Number(data.amount);
        });
        revenueEl.textContent = formatCurrency(totalRevenue);

        // Recent activities
        const activitiesQuery = query(collection(db, 'activities'), orderBy('timestamp', 'desc'), limit(5));
        const activitiesSnap = await getDocs(activitiesQuery);
        if (activitiesSnap.empty) {
          recentDiv.innerHTML = `<div class="empty-state">No recent activities</div>`;
        } else {
          let html = '';
          activitiesSnap.forEach(doc => {
            const data = doc.data();
            const text = data.text || 'Activity';
            const icon = data.icon || 'fa-circle';
            html += `<div class="activity-item"><i class="fas ${icon}"></i> ${text}</div>`;
          });
          recentDiv.innerHTML = html;
        }

        // Upcoming live
        const liveQuery = query(collection(db, 'liveClasses'), orderBy('startTime', 'asc'));
        const liveSnap2 = await getDocs(liveQuery);
        let hasLive = false;
        let liveHtml = '';
        liveSnap2.forEach(doc => {
          const data = doc.data();
          if (data.status === 'upcoming' || data.status === 'live') {
            hasLive = true;
            const title = data.title || 'Live Session';
            const time = data.startTime ? new Date(data.startTime.seconds * 1000).toLocaleString() : 'TBD';
            liveHtml += `<div class="live-item"><i class="fas fa-video"></i> ${title} <span class="time">${time}</span></div>`;
          }
        });
        upcomingDiv.innerHTML = hasLive ? liveHtml : `<div class="empty-state">No upcoming live sessions</div>`;

        // Chart
        const chartData = await fetchChartData();
        renderChart(chartData);

        // Notifications
        const notifSnap = await getDocs(collection(db, 'notifications'));
        let unread = 0;
        notifSnap.forEach(doc => {
          if (doc.data().read === false) unread++;
        });
        notifBadge.textContent = unread > 0 ? unread : '0';
        notifBadge.style.display = unread > 0 ? 'inline' : 'none';

      } catch (error) {
        console.error('Dashboard error:', error);
        showToast('Failed to load dashboard data.', 'error');
      } finally {
        hideLoading();
      }
    }

    async function fetchChartData() {
      try {
        const analyticsSnap = await getDocs(collection(db, 'analytics'));
        const dataMap = {};
        analyticsSnap.forEach(doc => {
          const d = doc.data();
          if (d.week && d.value !== undefined) dataMap[d.week] = d.value;
        });
        const weeks = ['W1', 'W2', 'W3', 'W4', 'W5', 'W6'];
        const values = weeks.map(w => dataMap[w] !== undefined ? dataMap[w] : Math.floor(Math.random() * 40 + 20));
        return { labels: weeks, values };
      } catch {
        return { labels: ['W1','W2','W3','W4','W5','W6'], values: [28, 35, 42, 38, 45, 52] };
      }
    }

    function renderChart(data) {
      const ctx = document.getElementById('analyticsChart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.labels,
          datasets: [{
            label: 'Engagement',
            data: data.values,
            borderColor: '#2a7de1',
            backgroundColor: 'rgba(42,125,225,0.08)',
            fill: true,
            tension: 0.3,
            pointBackgroundColor: '#2a7de1',
            pointRadius: 4,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, grid: { color: '#eef2f8' } } }
        }
      });
    }

    function listenToUpdates() {
      onSnapshot(collection(db, 'students'), snap => {
        totalStudentsEl.textContent = snap.size;
      });
      onSnapshot(collection(db, 'courses'), snap => {
        totalCoursesEl.textContent = snap.size;
      });
      onSnapshot(collection(db, 'liveClasses'), snap => {
        let live = 0;
        snap.forEach(doc => {
          const data = doc.data();
          if (data.status === 'upcoming' || data.status === 'live') live++;
        });
        liveClassesEl.textContent = live;
        loadDashboardData(); // refresh upcoming list
      });
      onSnapshot(collection(db, 'transactions'), snap => {
        let total = 0;
        snap.forEach(doc => {
          if (doc.data().amount) total += Number(doc.data().amount);
        });
        revenueEl.textContent = formatCurrency(total);
      });
    }

    // Language & Dark Mode
    let lang = 'en';
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const langLabel = document.getElementById('langLabel');
    const main = document.getElementById('mainContent');

    const translationMap = {
      en: {
        dashboard: 'Dashboard',
        courses: 'Courses',
        students: 'Students',
        live: 'Live Classes',
        revenue: 'Revenue',
        settings: 'Settings',
        logout: 'Logout',
        analytics: 'Analytics (last 6 weeks)',
        recent: 'Recent Activities',
        upcoming: 'Upcoming Live Sessions',
        pageTitle: 'Dashboard'
      },
      ar: {
        dashboard: 'لوحة التحكم',
        courses: 'الدورات',
        students: 'الطلاب',
        live: 'الحصص المباشرة',
        revenue: 'الإيرادات',
        settings: 'الإعدادات',
        logout: 'تسجيل الخروج',
        analytics: 'التحليلات (آخر 6 أسابيع)',
        recent: 'النشاطات الأخيرة',
        upcoming: 'الحصص المباشرة القادمة',
        pageTitle: 'لوحة التحكم'
      }
    };

    function applyLanguage(langCode) {
      const map = translationMap[langCode];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (map[key]) el.textContent = map[key];
      });
      document.getElementById('pageTitle').textContent = map.pageTitle;
      main.classList.toggle('rtl', langCode === 'ar');
    }

    langToggle.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      langLabel.textContent = lang.toUpperCase();
      applyLanguage(lang);
    });

    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      darkToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (confirm('Are you sure you want to logout?')) {
        try {
          await signOut(auth);
          window.location.href = 'login.html';
        } catch (error) {
          showToast('Logout failed.', 'error');
        }
      }
    });

    // Notifications button (temporary)
    document.getElementById('notifBtn').addEventListener('click', () => {
      notifBadge.style.display = 'none';
      showToast('You have 3 unread notifications', 'info');
    });

    // Init OneSignal
    initOneSignal();

    console.log('✅ EduCore Dashboard ready (production mode)');
  </script>
</body>
</html>
