<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · Teacher Login</title>
  
  <!-- Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Shared styles -->
  <link rel="stylesheet" href="shared.css">
  
  <style>
    /* ----- Login Page Specific (uses shared variables) ----- */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .login-card {
      background: var(--card-bg);
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2rem 2.2rem;
      border-radius: 2rem;
      box-shadow: var(--shadow);
      transition: background 0.2s, box-shadow 0.2s;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .logo-icon {
      font-size: 2rem;
      color: var(--primary);
      background: rgba(42,125,225,0.1);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
    }
    .logo-text {
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .logo-text span { color: var(--primary); }
    .subhead {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 1.4rem;
      position: relative;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      color: var(--text);
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 1rem;
    }
    .input-wrapper input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 2.8rem;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-size: 1rem;
      background: var(--bg);
      transition: 0.15s;
      font-weight: 500;
      color: var(--text);
    }
    .input-wrapper input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(42,125,225,0.15);
    }
    .input-wrapper .toggle-pwd {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1rem;
      cursor: pointer;
      padding: 0.3rem;
    }
    .input-wrapper .toggle-pwd:hover {
      color: var(--primary);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0.5rem 0 1.8rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .forgot-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
    }
    .forgot-link:hover { text-decoration: underline; }

    .btn-login {
      width: 100%;
      padding: 0.9rem;
      background: var(--primary);
      border: none;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 8px 20px -6px rgba(42,125,225,0.3);
    }
    .btn-login:hover { background: var(--primary-hover); transform: scale(1.01); }
    .btn-login:disabled { opacity: 0.7; transform: none; cursor: not-allowed; }

    .footer-lang {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }
    .lang-toggle, .dark-toggle {
      background: none;
      border: none;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.8rem;
    }
    .dark-toggle { color: var(--text-secondary); }

    .rtl { direction: rtl; }
    .rtl .input-wrapper i { left: auto; right: 1rem; }
    .rtl .input-wrapper input { padding: 0.9rem 2.8rem 0.9rem 1rem; }
    .rtl .input-wrapper .toggle-pwd { right: auto; left: 1rem; }
    .rtl .form-options { flex-direction: row-reverse; }

    @media (max-width: 480px) {
      .login-card { padding: 1.8rem 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="login-card" id="loginCard">
    <div class="logo-area">
      <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
      <div>
        <div class="logo-text">Edu<span>Core</span></div>
        <div class="subhead" id="subhead">Teacher Portal</div>
      </div>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="emailInput"><i class="fas fa-envelope" style="margin-right: 6px;"></i> Email</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="emailInput" placeholder="teacher@educore.com" required>
        </div>
      </div>
      <div class="form-group">
        <label for="passwordInput"><i class="fas fa-lock" style="margin-right: 6px;"></i> Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="passwordInput" placeholder="••••••••" required>
          <button type="button" class="toggle-pwd" id="togglePwd" aria-label="Show password">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe"> <span>Remember me</span>
        </label>
        <button type="button" class="forgot-link" id="forgotPasswordBtn"><i class="fas fa-key"></i> Forgot password?</button>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span id="btnText">Sign in</span>
        <span id="btnSpinner" style="display: none;"><span class="spinner"></span></span>
      </button>
    </form>

    <div class="footer-lang">
      <div>
        <button class="lang-toggle" id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
      </div>
      <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i> <span id="darkLabel">Dark</span></button>
    </div>
  </div>

  <script type="module">
    import { auth } from './firebase.js';
    import { initOneSignal } from './onesignal.js';
    import { showToast } from './shared.js';

    // DOM refs
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const rememberMe = document.getElementById('rememberMe');
    const forgotBtn = document.getElementById('forgotPasswordBtn');
    const togglePwd = document.getElementById('togglePwd');
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const subhead = document.getElementById('subhead');
    const langLabel = document.getElementById('langLabel');
    const darkLabel = document.getElementById('darkLabel');
    const loginCard = document.getElementById('loginCard');

    let currentLang = 'en';
    let isDark = false;

    function setLoading(isLoading) {
      loginBtn.disabled = isLoading;
      btnText.style.display = isLoading ? 'none' : 'inline';
      btnSpinner.style.display = isLoading ? 'inline' : 'none';
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // RTL / LTR
    function setLanguage(lang) {
      currentLang = lang;
      const card = document.getElementById('loginCard');
      if (lang === 'ar') {
        card.classList.add('rtl');
        document.documentElement.lang = 'ar';
        langLabel.textContent = 'العربية';
        subhead.textContent = 'بوابة المعلم';
        emailInput.placeholder = 'البريد الإلكتروني';
        passwordInput.placeholder = '••••••••';
        document.querySelector('label[for="emailInput"]').innerHTML = '<i class="fas fa-envelope" style="margin-left: 6px;"></i> البريد الإلكتروني';
        document.querySelector('label[for="passwordInput"]').innerHTML = '<i class="fas fa-lock" style="margin-left: 6px;"></i> كلمة المرور';
        document.querySelector('.remember-me span').textContent = 'تذكرني';
        forgotBtn.innerHTML = '<i class="fas fa-key"></i> نسيت كلمة المرور؟';
        btnText.textContent = 'تسجيل الدخول';
      } else {
        card.classList.remove('rtl');
        document.documentElement.lang = 'en';
        langLabel.textContent = 'English';
        subhead.textContent = 'Teacher Portal';
        emailInput.placeholder = 'teacher@educore.com';
        passwordInput.placeholder = '••••••••';
        document.querySelector('label[for="emailInput"]').innerHTML = '<i class="fas fa-envelope" style="margin-right: 6px;"></i> Email';
        document.querySelector('label[for="passwordInput"]').innerHTML = '<i class="fas fa-lock" style="margin-right: 6px;"></i> Password';
        document.querySelector('.remember-me span').textContent = 'Remember me';
        forgotBtn.innerHTML = '<i class="fas fa-key"></i> Forgot password?';
        btnText.textContent = 'Sign in';
      }
    }

    function toggleDark() {
      isDark = !isDark;
      document.body.classList.toggle('dark-mode', isDark);
      darkLabel.textContent = isDark ? 'Light' : 'Dark';
      darkToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i> ' : '<i class="fas fa-moon"></i> ';
      darkToggle.innerHTML += darkLabel.textContent;
    }

    // Login
    import { 
      signInWithEmailAndPassword, 
      sendPasswordResetEmail,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';

    async function handleLogin(e) {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!validateEmail(email)) {
        showToast('Please enter a valid email address.', 'error');
        return;
      }
      if (password.length < 6) {
        showToast('Password must be at least 6 characters.', 'error');
        return;
      }

      setLoading(true);
      try {
        await setPersistence(auth, rememberMe.checked ? browserLocalPersistence : browserSessionPersistence);
        const userCred = await signInWithEmailAndPassword(auth, email, password);
        setLoading(false);
        showToast('✅ Login successful! Redirecting…', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
      } catch (error) {
        setLoading(false);
        let msg = 'Login failed. Please check your credentials.';
        if (error.code === 'auth/user-not-found') msg = 'No user found with this email.';
        else if (error.code === 'auth/wrong-password') msg = 'Incorrect password.';
        else if (error.code === 'auth/too-many-requests') msg = 'Too many attempts. Try later.';
        showToast(msg, 'error');
      }
    }

    async function handleForgotPassword() {
      const email = emailInput.value.trim();
      if (!validateEmail(email)) {
        showToast('Please enter your email address first.', 'error');
        return;
      }
      setLoading(true);
      try {
        await sendPasswordResetEmail(auth, email);
        setLoading(false);
        showToast('✅ Password reset email sent!', 'success');
      } catch (error) {
        setLoading(false);
        showToast(error.code === 'auth/user-not-found' ? 'No user found with this email.' : 'Unable to send reset email.', 'error');
      }
    }

    togglePwd.addEventListener('click', () => {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      togglePwd.querySelector('i').className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    });

    loginForm.addEventListener('submit', handleLogin);
    forgotBtn.addEventListener('click', handleForgotPassword);
    langToggle.addEventListener('click', () => setLanguage(currentLang === 'en' ? 'ar' : 'en'));
    darkToggle.addEventListener('click', toggleDark);

    // Auto-redirect if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'dashboard.html';
      }
    });

    setLanguage('en');

    // Initialize OneSignal (if SDK loaded, will be loaded in full app)
    initOneSignal();
  </script>
</body>
</html>
