<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · Notifications Management</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Shared styles -->
  <link rel="stylesheet" href="shared.css">

  <style>
    body {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, border 0.2s;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 10;
    }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.5rem;
    }
    .sidebar-logo i {
      font-size: 1.8rem;
      color: var(--primary);
      background: rgba(42,125,225,0.1);
      padding: 0.6rem;
      border-radius: 14px;
    }
    .sidebar-logo span {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .sidebar-logo span small { color: var(--primary); }
    .sidebar nav { flex: 1; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
      margin-bottom: 0.3rem;
    }
    .sidebar nav a i { width: 1.4rem; }
    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: rgba(42,125,225,0.1);
      color: var(--primary);
    }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: 0.15s;
    }
    .sidebar-footer:hover { color: #e74c3c; }

    /* Main */
    .main {
      flex: 1;
      padding: 1.8rem 2rem 2.5rem;
      overflow-x: hidden;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .navbar h1 { font-size: 1.7rem; font-weight: 700; }
    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .navbar-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.15s;
    }
    .navbar-actions button:hover { color: var(--primary); }
    .lang-dark { display: flex; gap: 0.6rem; }
    .lang-dark button {
      background: none;
      border: none;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lang-dark .dark-toggle { color: var(--text-secondary); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.8rem;
      align-items: center;
    }
    .toolbar .search-box {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 40px;
      padding: 0.4rem 0.4rem 0.4rem 1.2rem;
      transition: 0.15s;
    }
    .toolbar .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(42,125,225,0.1);
    }
    .toolbar .search-box input {
      border: none;
      background: transparent;
      padding: 0.6rem 0;
      flex: 1;
      font-size: 0.95rem;
      outline: none;
      color: var(--text);
    }
    .toolbar .search-box button {
      background: var(--primary);
      border: none;
      color: white;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .toolbar .search-box button:hover { background: var(--primary-hover); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--bg); color: var(--text); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    .btn-sm { padding: 0.4rem 1rem; font-size: 0.8rem; }

    .table-wrapper {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .table-responsive { overflow-x: auto; padding: 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead { background: var(--bg); border-bottom: 2px solid var(--border); }
    th {
      text-align: left;
      padding: 0.9rem 1rem;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
    }
    td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(42,125,225,0.02); }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-success { background: #e3f5e9; color: #1f7840; }
    .badge-warning { background: #fef3e2; color: #b9770e; }
    .badge-info { background: #e8f0fe; color: #1a67c4; }

    .actions { display: flex; gap: 0.4rem; }
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      transition: 0.15s;
      padding: 0.3rem;
      font-size: 1rem;
    }
    .action-btn:hover { color: var(--primary); }
    .action-btn.text-danger:hover { color: #e74c3c; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
    }
    .empty-state i { font-size: 3rem; margin-bottom: 0.8rem; opacity: 0.5; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.5rem;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card-bg);
      border-radius: 24px;
      max-width: 520px;
      width: 100%;
      padding: 2rem;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.3);
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .modal h2 { margin-bottom: 1.2rem; font-weight: 700; }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.2rem;
    }
    .modal-close:hover { color: var(--text); }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-size: 0.95rem;
      background: var(--bg);
      color: var(--text);
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(42,125,225,0.1);
    }
    textarea.form-control { min-height: 80px; resize: vertical; }
    .form-actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.5rem;
      justify-content: flex-end;
    }
    .form-actions button {
      padding: 0.6rem 1.8rem;
      border-radius: 40px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .form-actions .cancel { background: var(--bg); color: var(--text); }
    .form-actions .submit { background: var(--primary); color: white; }

    .rtl { direction: rtl; }
    .rtl .sidebar nav a { flex-direction: row-reverse; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 1.2rem; }
    }
    @media (max-width: 480px) {
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar .search-box { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>Edu<small>Core</small></span>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-chart-pie"></i> <span data-key="dashboard">Dashboard</span></a>
      <a href="courses.html"><i class="fas fa-book-open"></i> <span data-key="courses">Courses</span></a>
      <a href="lessons.html"><i class="fas fa-file-alt"></i> <span data-key="lessons">Lessons</span></a>
      <a href="live-classes.html"><i class="fas fa-video"></i> <span data-key="live">Live Classes</span></a>
      <a href="students.html"><i class="fas fa-users"></i> <span data-key="students">Students</span></a>
      <a href="assignments.html"><i class="fas fa-clipboard-list"></i> <span data-key="assignments">Assignments</span></a>
      <a href="exams.html"><i class="fas fa-file-alt"></i> <span data-key="exams">Exams</span></a>
      <a href="exam-results.html"><i class="fas fa-chart-bar"></i> <span data-key="results">Results</span></a>
      <a href="notifications.html" class="active"><i class="fas fa-bell"></i> <span data-key="notifications">Notifications</span></a>
      <a href="revenue.html"><i class="fas fa-dollar-sign"></i> <span data-key="revenue">Revenue</span></a>
      <a href="settings.html"><i class="fas fa-cog"></i> <span data-key="settings">Settings</span></a>
    </nav>
    <div class="sidebar-footer" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> <span data-key="logout">Logout</span>
    </div>
  </aside>

  <!-- Main -->
  <div class="main" id="mainContent">
    <header class="navbar">
      <h1 id="pageTitle">🔔 Notifications</h1>
      <div class="navbar-actions">
        <div class="lang-dark">
          <button id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
          <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>
        <button><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search notifications...">
        <button id="searchBtn"><i class="fas fa-search"></i></button>
      </div>
      <button class="btn btn-primary" id="newNotificationBtn">
        <i class="fas fa-plus-circle"></i> New Notification
      </button>
    </div>

    <div class="table-wrapper">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th data-key="thTitle">Title</th>
              <th data-key="thType">Type</th>
              <th data-key="thStatus">Status</th>
              <th data-key="thTime">Scheduled / Sent</th>
              <th data-key="thActions">Actions</th>
            </tr>
          </thead>
          <tbody id="notificationsTableBody">
            <tr><td colspan="5"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><br>Loading notifications...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Notification Modal -->
  <div class="modal-overlay" id="notificationModal">
    <div class="modal">
      <button class="modal-close" id="notificationModalClose"><i class="fas fa-times"></i></button>
      <h2>New Notification</h2>
      <form id="notificationForm">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="notifTitle" required placeholder="Notification title">
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="notifMessage" rows="3" required placeholder="Notification message..."></textarea>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="notifType">
            <option value="info">Info</option>
            <option value="warning">Warning</option>
            <option value="success">Success</option>
          </select>
        </div>
        <div class="form-group">
          <label>Recipients</label>
          <select id="notifRecipients">
            <option value="all">All Students</option>
            <option value="course">Specific Course</option>
            <option value="individual">Individual Student</option>
          </select>
        </div>
        <div class="form-group">
          <label>Send Option</label>
          <select id="sendOption">
            <option value="now">Send Now</option>
            <option value="schedule">Schedule</option>
          </select>
        </div>
        <div class="form-group" id="scheduleGroup" style="display: none;">
          <label>Schedule Date & Time</label>
          <input type="datetime-local" id="scheduleDateTime">
        </div>
        <div class="form-actions">
          <button type="button" class="cancel" id="notificationCancelBtn">Cancel</button>
          <button type="submit" class="submit" id="submitBtn">Send Notification</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal" style="max-width: 420px; text-align: center;">
      <button class="modal-close" id="deleteModalClose"><i class="fas fa-times"></i></button>
      <i class="fas fa-exclamation-triangle" style="font-size: 2.5rem; color: #e74c3c; margin-bottom: 1rem;"></i>
      <h2>Delete Notification</h2>
      <p style="color: var(--text-secondary); margin: 12px 0 24px;">Are you sure you want to delete this notification?</p>
      <div class="form-actions" style="justify-content: center;">
        <button class="btn btn-secondary" id="deleteCancelBtn">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { showToast, showLoading, hideLoading } from './shared.js';
    import { initOneSignal } from './onesignal.js';
    import {
      onAuthStateChanged,
      signOut
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';
    import {
      collection,
      getDocs,
      addDoc,
      deleteDoc,
      doc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      Timestamp
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

    // Auth protection
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        console.log('✅ Logged in as:', user.email);
        document.body.classList.add('auth-ready');
        listenToNotifications();
      }
    });

    const tableBody = document.getElementById('notificationsTableBody');
    const searchInput = document.getElementById('searchInput');
    const notificationModal = document.getElementById('notificationModal');
    const deleteModal = document.getElementById('deleteModal');
    const scheduleGroup = document.getElementById('scheduleGroup');
    const sendOption = document.getElementById('sendOption');
    const submitBtn = document.getElementById('submitBtn');

    let allNotifications = [];
    let currentDeleteId = null;

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (confirm('Are you sure you want to logout?')) {
        try {
          await signOut(auth);
          window.location.href = 'login.html';
        } catch (error) {
          showToast('Logout failed.', 'error');
        }
      }
    });

    // Real-time listener
    function listenToNotifications() {
      showLoading();
      const q = query(collection(db, 'notifications'), orderBy('scheduledAt', 'desc'));
      onSnapshot(q, (snapshot) => {
        allNotifications = [];
        snapshot.forEach((doc) => {
          allNotifications.push({ id: doc.id, ...doc.data() });
        });
        filterNotifications();
        hideLoading();
      }, (error) => {
        console.error('Error:', error);
        hideLoading();
        showToast('Failed to load notifications.', 'error');
        tableBody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>Failed to load data.</div></td></tr>`;
      });
    }

    function filterNotifications() {
      const term = searchInput.value.toLowerCase();
      const filtered = allNotifications.filter(n =>
        (n.title || '').toLowerCase().includes(term) ||
        (n.message || '').toLowerCase().includes(term)
      );
      renderTable(filtered);
    }

    searchInput.addEventListener('input', filterNotifications);

    function renderTable(notifications) {
      if (notifications.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="fas fa-inbox"></i><p>No notifications found.</p></div></td></tr>`;
        return;
      }

      tableBody.innerHTML = notifications.map(notif => {
        const typeBadge = notif.type === 'warning' ? 'badge-warning' : (notif.type === 'success' ? 'badge-success' : 'badge-info');
        const status = notif.status || 'sent';
        const statusBadge = status === 'scheduled' ? 'badge-warning' : 'badge-success';
        const timeField = status === 'scheduled' ? notif.scheduledAt : notif.sentAt;
        const timeString = timeField
          ? new Date(timeField.seconds ? timeField.seconds * 1000 : timeField).toLocaleString()
          : '—';
        return `
          <tr>
            <td><strong>${escapeHtml(notif.title || 'Untitled')}</strong></td>
            <td><span class="badge ${typeBadge}">${notif.type || 'info'}</span></td>
            <td><span class="badge ${statusBadge}">${status}</span></td>
            <td>${timeString}</td>
            <td>
              <div class="actions">
                <button class="action-btn text-danger delete-btn" data-id="${notif.id}" title="Delete"><i class="fas fa-trash"></i></button>
              </div>
            </td>
          </tr>`;
      }).join('');

      tableBody.querySelectorAll('.delete-btn').forEach(btn =>
        btn.addEventListener('click', () => openDeleteModal(btn.dataset.id))
      );
    }

    // Send Notification Modal
    function openSendModal() {
      document.getElementById('notificationForm').reset();
      sendOption.value = 'now';
      scheduleGroup.style.display = 'none';
      submitBtn.textContent = 'Send Notification';
      notificationModal.classList.add('active');
    }

    function closeNotificationModal() {
      notificationModal.classList.remove('active');
    }

    sendOption.addEventListener('change', () => {
      const isScheduled = sendOption.value === 'schedule';
      scheduleGroup.style.display = isScheduled ? 'block' : 'none';
      submitBtn.textContent = isScheduled ? 'Schedule Notification' : 'Send Notification';
    });

    // Push notification via OneSignal (simplified – requires OneSignal REST API key to be fully functional)
    async function sendPushNotification(title, message) {
      try {
        // In production, you'd call OneSignal API from a backend.
        // Here we just log and assume the OneSignal SDK could trigger a notification.
        if (window.OneSignal) {
          // OneSignal is initialized; we could use OneSignal.sendSelfNotification or similar
          // but for true push to all users, a server call is required.
          console.log('Push notification would be sent:', { title, message });
        }
      } catch (e) {
        console.warn('Push notification error:', e);
      }
    }

    document.getElementById('notificationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('notifTitle').value.trim();
      const message = document.getElementById('notifMessage').value.trim();
      const type = document.getElementById('notifType').value;
      const recipients = document.getElementById('notifRecipients').value;
      const isNow = sendOption.value === 'now';

      const notifData = {
        title,
        message,
        type,
        recipients,
        updatedAt: serverTimestamp()
      };

      if (isNow) {
        notifData.status = 'sent';
        notifData.sentAt = serverTimestamp();
      } else {
        const scheduleValue = document.getElementById('scheduleDateTime').value;
        if (!scheduleValue) {
          showToast('Please select a schedule date and time.', 'error');
          return;
        }
        notifData.status = 'scheduled';
        notifData.scheduledAt = Timestamp.fromDate(new Date(scheduleValue));
      }

      try {
        await addDoc(collection(db, 'notifications'), notifData);

        if (isNow) {
          // Trigger push notification
          await sendPushNotification(title, message);
          showToast('Notification sent successfully!', 'success');
        } else {
          showToast('Notification scheduled!', 'success');
        }

        closeNotificationModal();
      } catch (error) {
        showToast('Error creating notification: ' + error.message, 'error');
      }
    });

    // Delete Notification
    function openDeleteModal(id) {
      currentDeleteId = id;
      deleteModal.classList.add('active');
    }

    function closeDeleteModal() {
      deleteModal.classList.remove('active');
      currentDeleteId = null;
    }

    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      if (!currentDeleteId) return;
      try {
        await deleteDoc(doc(db, 'notifications', currentDeleteId));
        showToast('Notification deleted.', 'success');
        closeDeleteModal();
      } catch (error) {
        showToast('Error deleting: ' + error.message, 'error');
      }
    });

    // Event bindings
    document.getElementById('newNotificationBtn').addEventListener('click', openSendModal);
    document.getElementById('notificationModalClose').addEventListener('click', closeNotificationModal);
    document.getElementById('notificationCancelBtn').addEventListener('click', closeNotificationModal);
    document.getElementById('deleteModalClose').addEventListener('click', closeDeleteModal);
    document.getElementById('deleteCancelBtn').addEventListener('click', closeDeleteModal);

    // Close modals on overlay click
    [notificationModal, deleteModal].forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('active');
      });
    });

    // Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeNotificationModal();
        closeDeleteModal();
      }
    });

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        if (m === "'") return '&#039;';
        return m;
      });
    }

    // Language & Dark Mode
    let lang = 'en';
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const langLabel = document.getElementById('langLabel');
    const main = document.getElementById('mainContent');

    const translations = {
      en: {
        dashboard: 'Dashboard',
        courses: 'Courses',
        lessons: 'Lessons',
        live: 'Live Classes',
        students: 'Students',
        assignments: 'Assignments',
        exams: 'Exams',
        results: 'Results',
        notifications: 'Notifications',
        revenue: 'Revenue',
        settings: 'Settings',
        logout: 'Logout',
        pageTitle: '🔔 Notifications',
        searchPlaceholder: 'Search notifications...',
        newBtn: '<i class="fas fa-plus-circle"></i> New Notification',
        thTitle: 'Title',
        thType: 'Type',
        thStatus: 'Status',
        thTime: 'Scheduled / Sent',
        thActions: 'Actions'
      },
      ar: {
        dashboard: 'لوحة التحكم',
        courses: 'الدورات',
        lessons: 'الدروس',
        live: 'الحصص المباشرة',
        students: 'الطلاب',
        assignments: 'الواجبات',
        exams: 'الامتحانات',
        results: 'النتائج',
        notifications: 'الإشعارات',
        revenue: 'الإيرادات',
        settings: 'الإعدادات',
        logout: 'تسجيل الخروج',
        pageTitle: '🔔 الإشعارات',
        searchPlaceholder: 'بحث عن إشعارات...',
        newBtn: '<i class="fas fa-plus-circle"></i> إشعار جديد',
        thTitle: 'العنوان',
        thType: 'النوع',
        thStatus: 'الحالة',
        thTime: 'وقت الإرسال / الجدولة',
        thActions: 'إجراءات'
      }
    };

    function applyLanguage(langCode) {
      const t = translations[langCode];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (t[key]) el.textContent = t[key];
      });
      document.getElementById('pageTitle').textContent = t.pageTitle;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('newNotificationBtn').innerHTML = t.newBtn;
      main.classList.toggle('rtl', langCode === 'ar');
    }

    langToggle.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      langLabel.textContent = lang.toUpperCase();
      applyLanguage(lang);
    });

    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      darkToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    // Init OneSignal
    initOneSignal();

    console.log('✅ Notifications Management ready (production mode)');
  </script>
</body>
</html>
