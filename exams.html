<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · Exams Management</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Shared styles -->
  <link rel="stylesheet" href="shared.css">
  
  <style>
    body {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, border 0.2s;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 10;
    }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.5rem;
    }
    .sidebar-logo i {
      font-size: 1.8rem;
      color: var(--primary);
      background: rgba(42,125,225,0.1);
      padding: 0.6rem;
      border-radius: 14px;
    }
    .sidebar-logo span {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .sidebar-logo span small { color: var(--primary); }
    .sidebar nav { flex: 1; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
      margin-bottom: 0.3rem;
    }
    .sidebar nav a i { width: 1.4rem; }
    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: rgba(42,125,225,0.1);
      color: var(--primary);
    }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: 0.15s;
    }
    .sidebar-footer:hover { color: #e74c3c; }

    /* Main */
    .main {
      flex: 1;
      padding: 1.8rem 2rem 2.5rem;
      overflow-x: hidden;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .navbar h1 { font-size: 1.7rem; font-weight: 700; }
    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .navbar-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.15s;
    }
    .navbar-actions button:hover { color: var(--primary); }
    .lang-dark { display: flex; gap: 0.6rem; }
    .lang-dark button {
      background: none;
      border: none;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lang-dark .dark-toggle { color: var(--text-secondary); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.8rem;
      align-items: center;
    }
    .toolbar .search-box {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 40px;
      padding: 0.4rem 0.4rem 0.4rem 1.2rem;
      transition: 0.15s;
    }
    .toolbar .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(42,125,225,0.1);
    }
    .toolbar .search-box input {
      border: none;
      background: transparent;
      padding: 0.6rem 0;
      flex: 1;
      font-size: 0.95rem;
      outline: none;
      color: var(--text);
    }
    .toolbar .search-box button {
      background: var(--primary);
      border: none;
      color: white;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .toolbar .search-box button:hover { background: var(--primary-hover); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--bg); color: var(--text); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    .btn-success { background: #10B981; color: white; }
    .btn-success:hover { background: #059669; }
    .btn-sm { padding: 0.4rem 1rem; font-size: 0.8rem; }

    .table-wrapper {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .table-responsive { overflow-x: auto; padding: 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead { background: var(--bg); border-bottom: 2px solid var(--border); }
    th {
      text-align: left;
      padding: 0.9rem 1rem;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
    }
    td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(42,125,225,0.02); }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-success { background: #e3f5e9; color: #1f7840; }
    .badge-warning { background: #fef3e2; color: #b9770e; }
    .badge-secondary { background: #eef2f8; color: #475569; }

    .actions { display: flex; gap: 0.4rem; }
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      transition: 0.15s;
      padding: 0.3rem;
      font-size: 1rem;
    }
    .action-btn:hover { color: var(--primary); }
    .action-btn.text-danger:hover { color: #e74c3c; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
    }
    .empty-state i { font-size: 3rem; margin-bottom: 0.8rem; opacity: 0.5; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.5rem;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card-bg);
      border-radius: 24px;
      max-width: 600px;
      width: 100%;
      padding: 2rem;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.3);
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .modal.wide { max-width: 700px; }
    .modal h2 { margin-bottom: 1.2rem; font-weight: 700; }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.2rem;
    }
    .modal-close:hover { color: var(--text); }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-size: 0.95rem;
      background: var(--bg);
      color: var(--text);
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(42,125,225,0.1);
    }
    textarea.form-control { min-height: 80px; resize: vertical; }
    .form-actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.5rem;
      justify-content: flex-end;
    }
    .form-actions button {
      padding: 0.6rem 1.8rem;
      border-radius: 40px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .form-actions .cancel { background: var(--bg); color: var(--text); }
    .form-actions .submit { background: var(--primary); color: white; }

    /* Question Cards */
    .question-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 0.8rem;
    }
    .options-list { margin-top: 0.5rem; }
    .option-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }
    .option-item input[type="radio"],
    .option-item input[type="checkbox"] {
      accent-color: var(--primary);
    }

    .rtl { direction: rtl; }
    .rtl .sidebar nav a { flex-direction: row-reverse; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 1.2rem; }
    }
    @media (max-width: 480px) {
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar .search-box { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>Edu<small>Core</small></span>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-chart-pie"></i> <span data-key="dashboard">Dashboard</span></a>
      <a href="courses.html"><i class="fas fa-book-open"></i> <span data-key="courses">Courses</span></a>
      <a href="lessons.html"><i class="fas fa-file-alt"></i> <span data-key="lessons">Lessons</span></a>
      <a href="live-classes.html"><i class="fas fa-video"></i> <span data-key="live">Live Classes</span></a>
      <a href="students.html"><i class="fas fa-users"></i> <span data-key="students">Students</span></a>
      <a href="assignments.html"><i class="fas fa-clipboard-list"></i> <span data-key="assignments">Assignments</span></a>
      <a href="exams.html" class="active"><i class="fas fa-file-alt"></i> <span data-key="exams">Exams</span></a>
      <a href="revenue.html"><i class="fas fa-dollar-sign"></i> <span data-key="revenue">Revenue</span></a>
      <a href="settings.html"><i class="fas fa-cog"></i> <span data-key="settings">Settings</span></a>
    </nav>
    <div class="sidebar-footer" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> <span data-key="logout">Logout</span>
    </div>
  </aside>

  <!-- Main -->
  <div class="main" id="mainContent">
    <header class="navbar">
      <h1 id="pageTitle">📝 Exams</h1>
      <div class="navbar-actions">
        <div class="lang-dark">
          <button id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
          <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>
        <button><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search exams...">
        <button id="searchBtn"><i class="fas fa-search"></i></button>
      </div>
      <button class="btn btn-primary" id="createExamBtn">
        <i class="fas fa-plus-circle"></i> Create Exam
      </button>
    </div>

    <div class="table-wrapper">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th data-key="thTitle">Title</th>
              <th data-key="thCourse">Course</th>
              <th data-key="thDate">Date</th>
              <th data-key="thQuestions">Questions</th>
              <th data-key="thActions">Actions</th>
            </tr>
          </thead>
          <tbody id="examsTableBody">
            <tr><td colspan="5"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><br>Loading exams...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Exam Form Modal -->
  <div class="modal-overlay" id="examFormModal">
    <div class="modal">
      <button class="modal-close" id="examFormClose"><i class="fas fa-times"></i></button>
      <h2 id="examFormTitle">Create Exam</h2>
      <form id="examForm">
        <input type="hidden" id="examId">
        <div class="form-group"><label>Title</label><input type="text" id="examTitle" required placeholder="Exam title"></div>
        <div class="form-group"><label>Description</label><textarea id="examDesc" rows="3" placeholder="Optional description"></textarea></div>
        <div class="form-group"><label>Course</label><input type="text" id="examCourse" required placeholder="e.g. Physics 101"></div>
        <div class="form-group"><label>Date</label><input type="date" id="examDate"></div>
        <div class="form-actions">
          <button type="button" class="cancel" id="examFormCancel">Cancel</button>
          <button type="submit" class="submit">Save Exam</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal" style="max-width: 420px; text-align: center;">
      <button class="modal-close" id="deleteModalClose"><i class="fas fa-times"></i></button>
      <i class="fas fa-exclamation-triangle" style="font-size: 2.5rem; color: #e74c3c; margin-bottom: 1rem;"></i>
      <h2>Delete Exam</h2>
      <p style="color: var(--text-secondary); margin: 12px 0 24px;">All questions will be permanently deleted.</p>
      <div class="form-actions" style="justify-content: center;">
        <button class="btn btn-secondary" id="deleteCancelBtn">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <!-- Questions Manager Modal -->
  <div class="modal-overlay" id="questionsModal">
    <div class="modal wide">
      <button class="modal-close" id="questionsModalClose"><i class="fas fa-times"></i></button>
      <h2>Manage Questions</h2>
      <div id="questionsContainer"></div>
      <div class="form-actions">
        <button class="btn btn-secondary" id="questionsCloseBtn">Close</button>
        <button class="btn btn-primary" id="addQuestionBtn"><i class="fas fa-plus"></i> Add Question</button>
      </div>
    </div>
  </div>

  <!-- Question Form Modal -->
  <div class="modal-overlay" id="questionFormModal">
    <div class="modal">
      <button class="modal-close" id="questionFormClose"><i class="fas fa-times"></i></button>
      <h2 id="questionFormTitle">Add Question</h2>
      <form id="questionForm">
        <input type="hidden" id="questionId">
        <div class="form-group">
          <label>Question Text</label>
          <textarea id="questionText" rows="3" required placeholder="Enter question"></textarea>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="questionType">
            <option value="multiple-choice">Multiple Choice</option>
            <option value="true-false">True / False</option>
            <option value="short-answer">Short Answer</option>
          </select>
        </div>
        <div id="optionsArea"></div>
        <div id="correctAnswerArea"></div>
        <div class="form-actions">
          <button type="button" class="cancel" id="questionFormCancel">Cancel</button>
          <button type="submit" class="submit">Save Question</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { showToast, showLoading, hideLoading } from './shared.js';
    import { initOneSignal } from './onesignal.js';
    import {
      onAuthStateChanged,
      signOut
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';
    import {
      collection,
      getDocs,
      addDoc,
      updateDoc,
      deleteDoc,
      doc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      Timestamp
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

    // Auth protection
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        console.log('✅ Logged in as:', user.email);
        document.body.classList.add('auth-ready');
        listenToExams();
      }
    });

    const tableBody = document.getElementById('examsTableBody');
    const searchInput = document.getElementById('searchInput');
    const examFormModal = document.getElementById('examFormModal');
    const deleteModal = document.getElementById('deleteModal');
    const questionsModal = document.getElementById('questionsModal');
    const questionFormModal = document.getElementById('questionFormModal');

    let allExams = [];
    let currentDeleteId = null;
    let currentManageExamId = null;
    let editingQuestionId = null;
    let savedQuestionOptions = [];

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (confirm('Are you sure you want to logout?')) {
        try {
          await signOut(auth);
          window.location.href = 'login.html';
        } catch (error) {
          showToast('Logout failed.', 'error');
        }
      }
    });

    // Real-time exams listener
    function listenToExams() {
      showLoading();
      const q = query(collection(db, 'exams'), orderBy('date', 'desc'));
      onSnapshot(q, (snapshot) => {
        allExams = [];
        snapshot.forEach((doc) => {
          allExams.push({ id: doc.id, ...doc.data() });
        });
        renderExamsTable();
        hideLoading();
      }, (error) => {
        console.error('Error:', error);
        hideLoading();
        showToast('Failed to load exams.', 'error');
        tableBody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>Failed to load data.</div></td></tr>`;
      });
    }

    function renderExamsTable() {
      const filtered = filterExams();
      if (filtered.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="fas fa-inbox"></i><p>No exams yet. Create your first!</p></div></td></tr>`;
        return;
      }
      tableBody.innerHTML = filtered.map(exam => {
        const dateStr = exam.date
          ? new Date(exam.date.seconds ? exam.date.seconds * 1000 : exam.date).toLocaleDateString()
          : '—';
        return `
          <tr>
            <td><strong>${escapeHtml(exam.title || 'Untitled')}</strong></td>
            <td>${escapeHtml(exam.course || '—')}</td>
            <td>${dateStr}</td>
            <td><button class="btn btn-sm btn-secondary manage-btn" data-id="${exam.id}">Manage</button></td>
            <td>
              <div class="actions">
                <button class="action-btn edit-btn" data-id="${exam.id}" title="Edit"><i class="fas fa-pen"></i></button>
                <button class="action-btn text-danger delete-btn" data-id="${exam.id}" title="Delete"><i class="fas fa-trash"></i></button>
              </div>
            </td>
          </tr>`;
      }).join('');

      tableBody.querySelectorAll('.manage-btn').forEach(btn =>
        btn.addEventListener('click', () => openQuestionsManager(btn.dataset.id))
      );
      tableBody.querySelectorAll('.edit-btn').forEach(btn =>
        btn.addEventListener('click', () => openEditExamModal(btn.dataset.id))
      );
      tableBody.querySelectorAll('.delete-btn').forEach(btn =>
        btn.addEventListener('click', () => openDeleteModal(btn.dataset.id))
      );
    }

    function filterExams() {
      const term = searchInput.value.toLowerCase();
      return allExams.filter(exam =>
        (exam.title || '').toLowerCase().includes(term) ||
        (exam.course || '').toLowerCase().includes(term)
      );
    }

    searchInput.addEventListener('input', renderExamsTable);

    // Exam CRUD
    function openCreateExamModal() {
      document.getElementById('examFormTitle').textContent = 'Create Exam';
      document.getElementById('examId').value = '';
      document.getElementById('examTitle').value = '';
      document.getElementById('examDesc').value = '';
      document.getElementById('examCourse').value = '';
      document.getElementById('examDate').value = '';
      examFormModal.classList.add('active');
    }

    function openEditExamModal(id) {
      const exam = allExams.find(e => e.id === id);
      if (!exam) return;
      document.getElementById('examFormTitle').textContent = 'Edit Exam';
      document.getElementById('examId').value = exam.id;
      document.getElementById('examTitle').value = exam.title || '';
      document.getElementById('examDesc').value = exam.description || '';
      document.getElementById('examCourse').value = exam.course || '';
      document.getElementById('examDate').value = exam.date
        ? new Date(exam.date.seconds ? exam.date.seconds * 1000 : exam.date).toISOString().split('T')[0]
        : '';
      examFormModal.classList.add('active');
    }

    function closeExamFormModal() {
      examFormModal.classList.remove('active');
    }

    document.getElementById('examForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('examId').value;
      const data = {
        title: document.getElementById('examTitle').value.trim(),
        description: document.getElementById('examDesc').value.trim(),
        course: document.getElementById('examCourse').value.trim(),
        date: document.getElementById('examDate').value ? Timestamp.fromDate(new Date(document.getElementById('examDate').value)) : null,
        updatedAt: serverTimestamp()
      };
      try {
        if (id) {
          await updateDoc(doc(db, 'exams', id), data);
          showToast('Exam updated!', 'success');
        } else {
          data.createdAt = serverTimestamp();
          await addDoc(collection(db, 'exams'), data);
          showToast('Exam created!', 'success');
        }
        closeExamFormModal();
      } catch (err) {
        showToast('Error saving: ' + err.message, 'error');
      }
    });

    // Delete
    function openDeleteModal(id) {
      currentDeleteId = id;
      deleteModal.classList.add('active');
    }
    function closeDeleteModal() {
      deleteModal.classList.remove('active');
      currentDeleteId = null;
    }
    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      if (!currentDeleteId) return;
      try {
        await deleteDoc(doc(db, 'exams', currentDeleteId));
        showToast('Exam deleted.', 'success');
        closeDeleteModal();
      } catch (err) {
        showToast('Error deleting: ' + err.message, 'error');
      }
    });

    // Questions Manager
    async function openQuestionsManager(examId) {
      currentManageExamId = examId;
      questionsModal.classList.add('active');
      await loadQuestions();
    }
    function closeQuestionsModal() {
      questionsModal.classList.remove('active');
      currentManageExamId = null;
    }

    async function loadQuestions() {
      const container = document.getElementById('questionsContainer');
      if (!currentManageExamId) return;
      try {
        const snap = await getDocs(collection(db, 'exams', currentManageExamId, 'questions'));
        if (snap.empty) {
          container.innerHTML = '<div class="empty-state">No questions added yet.</div>';
          return;
        }
        let html = '';
        snap.forEach(doc => {
          const q = doc.data();
          const typeLabel = q.type === 'multiple-choice' ? 'Multiple Choice' : (q.type === 'true-false' ? 'True / False' : 'Short Answer');
          html += `
            <div class="question-card">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong>${escapeHtml(q.text)}</strong>
                <div class="actions">
                  <button class="action-btn edit-question-btn" data-qid="${doc.id}" data-examid="${currentManageExamId}"><i class="fas fa-pen"></i></button>
                  <button class="action-btn text-danger delete-question-btn" data-qid="${doc.id}" data-examid="${currentManageExamId}"><i class="fas fa-trash"></i></button>
                </div>
              </div>
              <div style="font-size:0.8rem; color:var(--text-secondary);">${typeLabel}</div>
              ${q.options && q.options.length ? `<div class="options-list">${q.options.map((opt, i) => `<div class="option-item"><span>${String.fromCharCode(65+i)}. ${escapeHtml(opt)}</span></div>`).join('')}</div>` : ''}
              <div style="margin-top: 0.5rem;"><span style="color:var(--success); font-weight:600;">Answer:</span> ${escapeHtml(q.correctAnswer || '—')}</div>
            </div>`;
        });
        container.innerHTML = html;

        // Bind edit/delete question events
        container.querySelectorAll('.edit-question-btn').forEach(btn => {
          btn.addEventListener('click', () => editQuestion(btn.dataset.examid, btn.dataset.qid));
        });
        container.querySelectorAll('.delete-question-btn').forEach(btn => {
          btn.addEventListener('click', () => deleteQuestion(btn.dataset.examid, btn.dataset.qid));
        });
      } catch (err) {
        container.innerHTML = '<p style="color: #e74c3c;">Error loading questions.</p>';
      }
    }

    async function deleteQuestion(examId, qId) {
      if (!confirm('Delete this question?')) return;
      try {
        await deleteDoc(doc(db, 'exams', examId, 'questions', qId));
        loadQuestions();
      } catch (err) {
        showToast('Error deleting question.', 'error');
      }
    }

    // Add / Edit Question Form
    function openAddQuestionForm() {
      editingQuestionId = null;
      savedQuestionOptions = [];
      document.getElementById('questionFormTitle').textContent = 'Add Question';
      document.getElementById('questionId').value = '';
      document.getElementById('questionText').value = '';
      document.getElementById('questionType').value = 'multiple-choice';
      onQuestionTypeChange();
      questionFormModal.classList.add('active');
    }

    function editQuestion(examId, qId) {
      if (!currentManageExamId) return;
      getDoc(doc(db, 'exams', examId, 'questions', qId)).then(docSnap => {
        if (!docSnap.exists()) return;
        const q = docSnap.data();
        editingQuestionId = qId;
        savedQuestionOptions = q.options || [];
        document.getElementById('questionFormTitle').textContent = 'Edit Question';
        document.getElementById('questionId').value = qId;
        document.getElementById('questionText').value = q.text || '';
        document.getElementById('questionType').value = q.type || 'multiple-choice';
        document.getElementById('correctAnswerArea').dataset.savedAnswer = q.correctAnswer || '';
        onQuestionTypeChange();
        questionFormModal.classList.add('active');
      });
    }

    function closeQuestionFormModal() {
      questionFormModal.classList.remove('active');
    }

    function onQuestionTypeChange() {
      const type = document.getElementById('questionType').value;
      const optionsArea = document.getElementById('optionsArea');
      const correctArea = document.getElementById('correctAnswerArea');
      const savedAnswer = correctArea.dataset.savedAnswer || '';

      optionsArea.innerHTML = '';
      correctArea.innerHTML = '';

      if (type === 'multiple-choice') {
        optionsArea.innerHTML = `
          <div class="form-group"><label>Options</label>
            <div id="optionsList">
              ${(savedQuestionOptions.length ? savedQuestionOptions : ['','','','']).map((opt, i) => `
                <div class="option-item">
                  <input type="text" class="form-control option-input" value="${escapeHtml(opt)}" placeholder="Option ${i+1}">
                  <button type="button" class="btn btn-sm btn-danger remove-option-btn"><i class="fas fa-times"></i></button>
                </div>`).join('')}
            </div>
            <button type="button" class="btn btn-sm btn-secondary" id="addOptionBtn" style="margin-top:0.5rem;"><i class="fas fa-plus"></i> Add Option</button>
          </div>`;
        correctArea.innerHTML = `
          <div class="form-group"><label>Correct Answer</label>
            <select class="form-control" id="correctSelect"></select>
          </div>`;
        setTimeout(() => populateCorrectSelect(savedAnswer), 0);

        document.getElementById('addOptionBtn').addEventListener('click', addOption);
      } else if (type === 'true-false') {
        correctArea.innerHTML = `
          <div class="form-group"><label>Correct Answer</label>
            <select class="form-control" id="correctTF">
              <option value="True" ${savedAnswer === 'True' ? 'selected' : ''}>True</option>
              <option value="False" ${savedAnswer === 'False' ? 'selected' : ''}>False</option>
            </select>
          </div>`;
      } else if (type === 'short-answer') {
        correctArea.innerHTML = `
          <div class="form-group"><label>Correct Answer (Keywords)</label>
            <input type="text" class="form-control" id="correctShort" value="${escapeHtml(savedAnswer)}" placeholder="e.g. photosynthesis, light">
          </div>`;
      }

      // Add event listeners to remove buttons
      document.querySelectorAll('.remove-option-btn').forEach(btn => {
        btn.addEventListener('click', () => btn.closest('.option-item').remove());
      });
    }

    function addOption() {
      const list = document.getElementById('optionsList');
      const div = document.createElement('div');
      div.className = 'option-item';
      div.innerHTML = `<input type="text" class="form-control option-input" placeholder="Option">
        <button type="button" class="btn btn-sm btn-danger remove-option-btn"><i class="fas fa-times"></i></button>`;
      list.appendChild(div);
      div.querySelector('.remove-option-btn').addEventListener('click', () => div.remove());
    }

    function populateCorrectSelect(saved) {
      const select = document.getElementById('correctSelect');
      if (!select) return;
      const inputs = document.querySelectorAll('.option-input');
      select.innerHTML = '';
      inputs.forEach((inp, i) => {
        const opt = document.createElement('option');
        opt.value = String.fromCharCode(65 + i);
        opt.textContent = `${String.fromCharCode(65 + i)}. ${inp.value || 'Option ' + (i+1)}`;
        if (saved === opt.value) opt.selected = true;
        select.appendChild(opt);
      });
    }

    document.getElementById('questionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = document.getElementById('questionType').value;
      const text = document.getElementById('questionText').value.trim();
      let options = [];
      let correctAnswer = '';

      if (type === 'multiple-choice') {
        const optionInputs = document.querySelectorAll('.option-input');
        options = Array.from(optionInputs).map(inp => inp.value.trim()).filter(v => v);
        correctAnswer = document.getElementById('correctSelect')?.value || '';
      } else if (type === 'true-false') {
        correctAnswer = document.getElementById('correctTF')?.value || '';
      } else {
        correctAnswer = document.getElementById('correctShort')?.value.trim() || '';
      }

      const questionData = { type, text, correctAnswer, options };

      try {
        const examRef = collection(db, 'exams', currentManageExamId, 'questions');
        if (editingQuestionId) {
          await updateDoc(doc(db, 'exams', currentManageExamId, 'questions', editingQuestionId), questionData);
          showToast('Question updated.', 'success');
        } else {
          await addDoc(examRef, questionData);
          showToast('Question added.', 'success');
        }
        closeQuestionFormModal();
        loadQuestions();
      } catch (err) {
        showToast('Error saving question: ' + err.message, 'error');
      }
    });

    // Event bindings
    document.getElementById('createExamBtn').addEventListener('click', openCreateExamModal);
    document.getElementById('examFormClose').addEventListener('click', closeExamFormModal);
    document.getElementById('examFormCancel').addEventListener('click', closeExamFormModal);
    document.getElementById('deleteModalClose').addEventListener('click', closeDeleteModal);
    document.getElementById('deleteCancelBtn').addEventListener('click', closeDeleteModal);
    document.getElementById('questionsModalClose').addEventListener('click', closeQuestionsModal);
    document.getElementById('questionsCloseBtn').addEventListener('click', closeQuestionsModal);
    document.getElementById('addQuestionBtn').addEventListener('click', openAddQuestionForm);
    document.getElementById('questionFormClose').addEventListener('click', closeQuestionFormModal);
    document.getElementById('questionFormCancel').addEventListener('click', closeQuestionFormModal);

    // Close modals on overlay click
    [examFormModal, deleteModal, questionsModal, questionFormModal].forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('active');
      });
    });

    // Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeExamFormModal();
        closeDeleteModal();
        closeQuestionsModal();
        closeQuestionFormModal();
      }
    });

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        if (m === "'") return '&#039;';
        return m;
      });
    }

    // Language & Dark Mode
    let lang = 'en';
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const langLabel = document.getElementById('langLabel');
    const main = document.getElementById('mainContent');

    const translations = {
      en: {
        dashboard: 'Dashboard',
        courses: 'Courses',
        lessons: 'Lessons',
        live: 'Live Classes',
        students: 'Students',
        assignments: 'Assignments',
        exams: 'Exams',
        revenue: 'Revenue',
        settings: 'Settings',
        logout: 'Logout',
        pageTitle: '📝 Exams',
        searchPlaceholder: 'Search exams...',
        createBtn: '<i class="fas fa-plus-circle"></i> Create Exam',
        thTitle: 'Title',
        thCourse: 'Course',
        thDate: 'Date',
        thQuestions: 'Questions',
        thActions: 'Actions'
      },
      ar: {
        dashboard: 'لوحة التحكم',
        courses: 'الدورات',
        lessons: 'الدروس',
        live: 'الحصص المباشرة',
        students: 'الطلاب',
        assignments: 'الواجبات',
        exams: 'الامتحانات',
        revenue: 'الإيرادات',
        settings: 'الإعدادات',
        logout: 'تسجيل الخروج',
        pageTitle: '📝 الامتحانات',
        searchPlaceholder: 'بحث عن امتحانات...',
        createBtn: '<i class="fas fa-plus-circle"></i> إنشاء امتحان',
        thTitle: 'العنوان',
        thCourse: 'الدورة',
        thDate: 'التاريخ',
        thQuestions: 'الأسئلة',
        thActions: 'إجراءات'
      }
    };

    function applyLanguage(langCode) {
      const t = translations[langCode];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (t[key]) el.textContent = t[key];
      });
      document.getElementById('pageTitle').textContent = t.pageTitle;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('createExamBtn').innerHTML = t.createBtn;
      main.classList.toggle('rtl', langCode === 'ar');
    }

    langToggle.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      langLabel.textContent = lang.toUpperCase();
      applyLanguage(lang);
    });

    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      darkToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    // Init OneSignal
    initOneSignal();
    console.log('✅ Exams Management ready (production mode)');
  </script>
</body>
</html>
