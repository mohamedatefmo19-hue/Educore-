<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · Messages</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Shared styles -->
  <link rel="stylesheet" href="shared.css">

  <style>
    body {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, border 0.2s;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 10;
    }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.5rem;
    }
    .sidebar-logo i {
      font-size: 1.8rem;
      color: var(--primary);
      background: rgba(42,125,225,0.1);
      padding: 0.6rem;
      border-radius: 14px;
    }
    .sidebar-logo span {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .sidebar-logo span small { color: var(--primary); }
    .sidebar nav { flex: 1; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
      margin-bottom: 0.3rem;
    }
    .sidebar nav a i { width: 1.4rem; }
    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: rgba(42,125,225,0.1);
      color: var(--primary);
    }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: 0.15s;
    }
    .sidebar-footer:hover { color: #e74c3c; }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1.2rem 2rem;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
    }
    .navbar h1 { font-size: 1.5rem; font-weight: 700; }
    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .navbar-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.15s;
    }
    .navbar-actions button:hover { color: var(--primary); }
    .lang-dark { display: flex; gap: 0.6rem; }
    .lang-dark button {
      background: none;
      border: none;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lang-dark .dark-toggle { color: var(--text-secondary); }

    .chat-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Conversations Panel */
    .conversations-panel {
      width: 340px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
    }
    .conversations-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .search-box {
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      border: 1.5px solid var(--border);
      border-radius: 40px;
      font-size: 0.9rem;
      background: var(--bg);
      color: var(--text);
    }
    .search-box input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(42,125,225,0.1);
    }
    .search-box i {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }
    .conversations-list {
      flex: 1;
      overflow-y: auto;
    }
    .conversation-item {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .conversation-item:hover,
    .conversation-item.active {
      background: rgba(42,125,225,0.04);
    }
    .conversation-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .conversation-info {
      flex: 1;
      min-width: 0;
    }
    .conversation-name {
      font-weight: 600;
      font-size: 0.9rem;
    }
    .conversation-preview {
      font-size: 0.8rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conversation-meta {
      text-align: right;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }
    .unread-badge {
      background: var(--primary);
      color: white;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      min-width: 20px;
      text-align: center;
      display: inline-block;
      margin-top: 4px;
    }
    .empty-conversations {
      padding: 2rem;
      text-align: center;
      color: var(--text-secondary);
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .chat-header {
      padding: 0.8rem 1.5rem;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .back-btn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 1.2rem;
    }
    .chat-messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message-bubble {
      max-width: 70%;
      padding: 0.7rem 1rem;
      border-radius: 18px;
      position: relative;
      font-size: 0.9rem;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message-sent {
      align-self: flex-end;
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message-received {
      align-self: flex-start;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message-time {
      font-size: 0.65rem;
      opacity: 0.8;
      margin-top: 4px;
      display: block;
      text-align: right;
    }
    .chat-input {
      padding: 1rem;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }
    .chat-input input {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 24px;
      font-size: 0.9rem;
      background: var(--bg);
      color: var(--text);
    }
    .chat-input input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .no-chat-selected {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--bg); color: var(--text); }
    .btn-secondary:hover { background: var(--border); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.5rem;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--card-bg);
      border-radius: 24px;
      max-width: 420px;
      width: 100%;
      padding: 2rem;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.3);
      position: relative;
    }
    .modal h2 { margin-bottom: 1.2rem; font-weight: 700; }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.2rem;
    }
    .modal-close:hover { color: var(--text); }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
    }
    .form-group input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-size: 0.95rem;
      background: var(--bg);
      color: var(--text);
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(42,125,225,0.1);
    }
    .form-actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.5rem;
      justify-content: flex-end;
    }
    .form-actions button {
      padding: 0.6rem 1.8rem;
      border-radius: 40px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .form-actions .cancel { background: var(--bg); color: var(--text); }
    .form-actions .submit { background: var(--primary); color: white; }

    .rtl { direction: rtl; }
    .rtl .sidebar nav a { flex-direction: row-reverse; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 0; }
      .navbar { padding: 0.8rem 1rem; }
      .conversations-panel {
        width: 100%;
        display: block;
      }
      .chat-area {
        display: none;
        width: 100%;
      }
      .chat-area.active {
        display: flex;
      }
      .back-btn {
        display: block;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>Edu<small>Core</small></span>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-chart-pie"></i> <span data-key="dashboard">Dashboard</span></a>
      <a href="courses.html"><i class="fas fa-book-open"></i> <span data-key="courses">Courses</span></a>
      <a href="lessons.html"><i class="fas fa-file-alt"></i> <span data-key="lessons">Lessons</span></a>
      <a href="live-classes.html"><i class="fas fa-video"></i> <span data-key="live">Live Classes</span></a>
      <a href="students.html"><i class="fas fa-users"></i> <span data-key="students">Students</span></a>
      <a href="assignments.html"><i class="fas fa-clipboard-list"></i> <span data-key="assignments">Assignments</span></a>
      <a href="exams.html"><i class="fas fa-file-alt"></i> <span data-key="exams">Exams</span></a>
      <a href="exam-results.html"><i class="fas fa-chart-bar"></i> <span data-key="results">Results</span></a>
      <a href="notifications.html"><i class="fas fa-bell"></i> <span data-key="notifications">Notifications</span></a>
      <a href="messages.html" class="active"><i class="fas fa-comments"></i> <span data-key="messages">Messages</span></a>
      <a href="revenue.html"><i class="fas fa-dollar-sign"></i> <span data-key="revenue">Revenue</span></a>
      <a href="settings.html"><i class="fas fa-cog"></i> <span data-key="settings">Settings</span></a>
    </nav>
    <div class="sidebar-footer" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> <span data-key="logout">Logout</span>
    </div>
  </aside>

  <!-- Main -->
  <div class="main" id="mainContent">
    <header class="navbar">
      <h1 id="pageTitle">💬 Messages</h1>
      <div class="navbar-actions">
        <div class="lang-dark">
          <button id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
          <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>
        <button><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
      </div>
    </header>

    <div class="chat-container">
      <!-- Conversations Panel -->
      <div class="conversations-panel" id="conversationsPanel">
        <div class="conversations-header">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchConversation" placeholder="Search conversations...">
          </div>
          <button class="btn btn-primary" style="margin-top: 0.8rem; width: 100%;" id="newChatBtn">
            <i class="fas fa-plus"></i> New Conversation
          </button>
        </div>
        <div class="conversations-list" id="conversationsList"></div>
      </div>

      <!-- Chat Area -->
      <div class="chat-area" id="chatArea">
        <div class="chat-header">
          <button class="back-btn" id="backToConversations"><i class="fas fa-arrow-left"></i></button>
          <div class="conversation-avatar" style="width: 36px; height: 36px;" id="chatAvatar">?</div>
          <div>
            <div style="font-weight: 600;" id="chatName">Select a conversation</div>
          </div>
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="no-chat-selected">← Select a conversation to start messaging</div>
        </div>
        <div class="chat-input">
          <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') document.getElementById('sendMessageBtn').click()">
          <button class="btn btn-primary" id="sendMessageBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- New Chat Modal -->
  <div class="modal-overlay" id="newChatModal">
    <div class="modal">
      <button class="modal-close" id="newChatModalClose"><i class="fas fa-times"></i></button>
      <h2>New Conversation</h2>
      <div class="form-group">
        <label>Student Name</label>
        <input type="text" id="newStudentName" placeholder="Enter student name">
      </div>
      <div class="form-group">
        <label>Student ID (optional)</label>
        <input type="text" id="newStudentId" placeholder="e.g., student@example.com">
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" id="newChatCancel">Cancel</button>
        <button class="btn btn-primary" id="startNewChatBtn">Start Chat</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { showToast, showLoading, hideLoading } from './shared.js';
    import { initOneSignal } from './onesignal.js';
    import {
      onAuthStateChanged,
      signOut
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';
    import {
      collection,
      getDocs,
      addDoc,
      updateDoc,
      doc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      writeBatch
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

    // Auth protection
    let currentUser = null;
    let TEACHER_ID = '';
    let TEACHER_NAME = '';

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        currentUser = user;
        TEACHER_ID = user.uid;
        TEACHER_NAME = user.displayName || user.email || 'Teacher';
        document.body.classList.add('auth-ready');
        listenToMessages();
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (confirm('Are you sure you want to logout?')) {
        try {
          await signOut(auth);
          window.location.href = 'login.html';
        } catch (error) {
          showToast('Logout failed.', 'error');
        }
      }
    });

    // State
    let allMessages = [];
    let conversationsMap = new Map();
    let unreadCounts = new Map();
    let currentChatId = null;
    let currentStudentName = '';

    // Real-time listener
    function listenToMessages() {
      showLoading();
      const q = query(collection(db, 'messages'), orderBy('timestamp', 'desc'));
      onSnapshot(q, (snapshot) => {
        allMessages = [];
        snapshot.forEach(doc => allMessages.push({ id: doc.id, ...doc.data() }));
        buildConversations();
        hideLoading();
      }, (error) => {
        console.error('Error:', error);
        hideLoading();
        showToast('Failed to load messages.', 'error');
      });
    }

    function buildConversations() {
      conversationsMap.clear();
      unreadCounts.clear();

      allMessages.forEach(msg => {
        if (msg.senderId !== TEACHER_ID && msg.receiverId !== TEACHER_ID) return;
        const isTeacherSender = msg.senderId === TEACHER_ID;
        const otherId = isTeacherSender ? msg.receiverId : msg.senderId;
        const otherName = isTeacherSender ? (msg.receiverName || otherId) : (msg.senderName || otherId);

        if (!conversationsMap.has(otherId)) {
          conversationsMap.set(otherId, {
            studentId: otherId,
            studentName: otherName,
            lastMessage: msg.text,
            lastTimestamp: msg.timestamp,
            unreadCount: 0
          });
        } else {
          const conv = conversationsMap.get(otherId);
          if (msg.timestamp && (!conv.lastTimestamp || msg.timestamp > conv.lastTimestamp)) {
            conv.lastMessage = msg.text;
            conv.lastTimestamp = msg.timestamp;
          }
        }

        if (msg.receiverId === TEACHER_ID && msg.read === false) {
          unreadCounts.set(otherId, (unreadCounts.get(otherId) || 0) + 1);
        }
      });

      conversationsMap.forEach((conv, otherId) => {
        conv.unreadCount = unreadCounts.get(otherId) || 0;
      });

      renderConversations();
      if (currentChatId) renderChatMessages(currentChatId);
    }

    function renderConversations() {
      const container = document.getElementById('conversationsList');
      const searchTerm = document.getElementById('searchConversation').value.toLowerCase();
      const conversationsArray = Array.from(conversationsMap.values())
        .filter(c => c.studentName.toLowerCase().includes(searchTerm))
        .sort((a, b) => (b.lastTimestamp?.seconds || 0) - (a.lastTimestamp?.seconds || 0));

      if (conversationsArray.length === 0) {
        container.innerHTML = '<div class="empty-conversations">No conversations yet.</div>';
        return;
      }

      container.innerHTML = conversationsArray.map(conv => {
        const timeStr = conv.lastTimestamp ? new Date(conv.lastTimestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        const activeClass = currentChatId === conv.studentId ? 'active' : '';
        return `
          <div class="conversation-item ${activeClass}" data-chatid="${conv.studentId}" data-studentname="${escapeHtml(conv.studentName)}">
            <div class="conversation-avatar">${conv.studentName.charAt(0).toUpperCase()}</div>
            <div class="conversation-info">
              <div class="conversation-name">${escapeHtml(conv.studentName)}</div>
              <div class="conversation-preview">${escapeHtml(conv.lastMessage || '')}</div>
            </div>
            <div class="conversation-meta">
              <div>${timeStr}</div>
              ${conv.unreadCount > 0 ? `<span class="unread-badge">${conv.unreadCount}</span>` : ''}
            </div>
          </div>`;
      }).join('');

      // Bind click events
      container.querySelectorAll('.conversation-item').forEach(item => {
        item.addEventListener('click', () => {
          selectConversation(item.dataset.chatid, item.dataset.studentname);
        });
      });
    }

    document.getElementById('searchConversation').addEventListener('input', renderConversations);

    function selectConversation(studentId, studentName) {
      currentChatId = studentId;
      currentStudentName = studentName;

      document.getElementById('chatAvatar').textContent = studentName.charAt(0).toUpperCase();
      document.getElementById('chatName').textContent = studentName;
      renderChatMessages(studentId);
      markMessagesAsRead(studentId);

      if (window.innerWidth <= 768) {
        document.getElementById('conversationsPanel').style.display = 'none';
        document.getElementById('chatArea').classList.add('active');
      }
    }

    document.getElementById('backToConversations').addEventListener('click', () => {
      if (window.innerWidth <= 768) {
        document.getElementById('conversationsPanel').style.display = 'block';
        document.getElementById('chatArea').classList.remove('active');
      }
    });

    async function markMessagesAsRead(chatId) {
      const batch = writeBatch(db);
      allMessages.filter(msg => msg.receiverId === TEACHER_ID && msg.senderId === chatId && msg.read === false)
        .forEach(msg => batch.update(doc(db, 'messages', msg.id), { read: true }));
      try { await batch.commit(); } catch (err) { console.error(err); }
    }

    function renderChatMessages(chatId) {
      const container = document.getElementById('chatMessages');
      const chatMessages = allMessages
        .filter(msg => (msg.senderId === chatId && msg.receiverId === TEACHER_ID) || (msg.senderId === TEACHER_ID && msg.receiverId === chatId))
        .sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));

      if (chatMessages.length === 0) {
        container.innerHTML = '<div class="no-chat-selected">No messages yet. Say hello!</div>';
        return;
      }

      container.innerHTML = chatMessages.map(msg => {
        const isSent = msg.senderId === TEACHER_ID;
        const timeStr = msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        return `
          <div class="message-bubble ${isSent ? 'message-sent' : 'message-received'}">
            ${escapeHtml(msg.text)}
            <span class="message-time">${timeStr}</span>
          </div>`;
      }).join('');
      container.scrollTop = container.scrollHeight;
    }

    // Send message
    document.getElementById('sendMessageBtn').addEventListener('click', async () => {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentChatId) return;

      try {
        await addDoc(collection(db, 'messages'), {
          senderId: TEACHER_ID,
          senderName: TEACHER_NAME,
          receiverId: currentChatId,
          receiverName: currentStudentName,
          text,
          timestamp: serverTimestamp(),
          read: false
        });
        input.value = '';
      } catch (error) {
        showToast('Error sending message.', 'error');
      }
    });

    // New conversation modal
    document.getElementById('newChatBtn').addEventListener('click', () => {
      document.getElementById('newChatModal').classList.add('active');
    });
    document.getElementById('newChatModalClose').addEventListener('click', () => {
      document.getElementById('newChatModal').classList.remove('active');
    });
    document.getElementById('newChatCancel').addEventListener('click', () => {
      document.getElementById('newChatModal').classList.remove('active');
    });

    document.getElementById('startNewChatBtn').addEventListener('click', () => {
      const name = document.getElementById('newStudentName').value.trim();
      const id = document.getElementById('newStudentId').value.trim() || name.toLowerCase().replace(/\s/g, '_');
      if (!name) {
        showToast('Please enter a student name.', 'error');
        return;
      }
      document.getElementById('newChatModal').classList.remove('active');
      document.getElementById('newStudentName').value = '';
      document.getElementById('newStudentId').value = '';
      selectConversation(id, name);
    });

    // Close modal on overlay click
    document.getElementById('newChatModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('newChatModal')) {
        document.getElementById('newChatModal').classList.remove('active');
      }
    });

    // Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.getElementById('newChatModal').classList.remove('active');
      }
    });

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        if (m === "'") return '&#039;';
        return m;
      });
    }

    // Language & Dark Mode
    let lang = 'en';
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const langLabel = document.getElementById('langLabel');

    const translations = {
      en: {
        dashboard: 'Dashboard',
        courses: 'Courses',
        lessons: 'Lessons',
        live: 'Live Classes',
        students: 'Students',
        assignments: 'Assignments',
        exams: 'Exams',
        results: 'Results',
        notifications: 'Notifications',
        messages: 'Messages',
        revenue: 'Revenue',
        settings: 'Settings',
        logout: 'Logout',
        pageTitle: '💬 Messages',
        searchPlaceholder: 'Search conversations...',
        newChatBtn: '<i class="fas fa-plus"></i> New Conversation',
        messageInputPlaceholder: 'Type a message...'
      },
      ar: {
        dashboard: 'لوحة التحكم',
        courses: 'الدورات',
        lessons: 'الدروس',
        live: 'الحصص المباشرة',
        students: 'الطلاب',
        assignments: 'الواجبات',
        exams: 'الامتحانات',
        results: 'النتائج',
        notifications: 'الإشعارات',
        messages: 'الرسائل',
        revenue: 'الإيرادات',
        settings: 'الإعدادات',
        logout: 'تسجيل الخروج',
        pageTitle: '💬 الرسائل',
        searchPlaceholder: 'بحث في المحادثات...',
        newChatBtn: '<i class="fas fa-plus"></i> محادثة جديدة',
        messageInputPlaceholder: 'اكتب رسالة...'
      }
    };

    function applyLanguage(langCode) {
      const t = translations[langCode];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (t[key]) el.textContent = t[key];
      });
      document.getElementById('pageTitle').textContent = t.pageTitle;
      document.getElementById('searchConversation').placeholder = t.searchPlaceholder;
      document.getElementById('newChatBtn').innerHTML = t.newChatBtn;
      document.getElementById('messageInput').placeholder = t.messageInputPlaceholder;
      document.getElementById('mainContent').classList.toggle('rtl', langCode === 'ar');
    }

    langToggle.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      langLabel.textContent = lang.toUpperCase();
      applyLanguage(lang);
    });

    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      darkToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    // Init OneSignal
    initOneSignal();
    console.log('✅ Messages ready (production mode)');
  </script>
</body>
</html>
