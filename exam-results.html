<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · Exam Results</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Shared styles -->
  <link rel="stylesheet" href="shared.css">

  <style>
    body {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, border 0.2s;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 10;
    }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.5rem;
    }
    .sidebar-logo i {
      font-size: 1.8rem;
      color: var(--primary);
      background: rgba(42,125,225,0.1);
      padding: 0.6rem;
      border-radius: 14px;
    }
    .sidebar-logo span {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .sidebar-logo span small { color: var(--primary); }
    .sidebar nav { flex: 1; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
      margin-bottom: 0.3rem;
    }
    .sidebar nav a i { width: 1.4rem; }
    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: rgba(42,125,225,0.1);
      color: var(--primary);
    }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: 0.15s;
    }
    .sidebar-footer:hover { color: #e74c3c; }

    /* Main */
    .main {
      flex: 1;
      padding: 1.8rem 2rem 2.5rem;
      overflow-x: hidden;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .navbar h1 { font-size: 1.7rem; font-weight: 700; }
    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .navbar-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.15s;
    }
    .navbar-actions button:hover { color: var(--primary); }
    .lang-dark { display: flex; gap: 0.6rem; }
    .lang-dark button {
      background: none;
      border: none;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lang-dark .dark-toggle { color: var(--text-secondary); }

    .search-box {
      position: relative;
      max-width: 300px;
      width: 100%;
    }
    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      border: 1.5px solid var(--border);
      border-radius: 40px;
      font-size: 0.9rem;
      background: var(--bg);
      color: var(--text);
    }
    .search-box input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(42,125,225,0.1);
    }
    .search-box i {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }

    /* Stats cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.2rem;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.3rem;
    }
    .stat-icon.blue { background: var(--primary); }
    .stat-icon.green { background: #10B981; }
    .stat-icon.amber { background: #F59E0B; }
    .stat-icon.red { background: #EF4444; }
    .stat-info h4 {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .stat-info .value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 0.2rem;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .chart-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      border: 1px solid var(--border);
    }
    .chart-card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .table-wrapper {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .table-responsive { overflow-x: auto; padding: 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead { background: var(--bg); border-bottom: 2px solid var(--border); }
    th {
      text-align: left;
      padding: 0.9rem 1rem;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
    }
    td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(42,125,225,0.02); }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-success { background: #e3f5e9; color: #1f7840; }
    .badge-danger { background: #fde8e8; color: #b3403a; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
    }
    .empty-state i { font-size: 3rem; margin-bottom: 0.8rem; opacity: 0.5; }

    .rtl { direction: rtl; }
    .rtl .sidebar nav a { flex-direction: row-reverse; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 1.2rem; }
      .charts-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>Edu<small>Core</small></span>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-chart-pie"></i> <span data-key="dashboard">Dashboard</span></a>
      <a href="courses.html"><i class="fas fa-book-open"></i> <span data-key="courses">Courses</span></a>
      <a href="lessons.html"><i class="fas fa-file-alt"></i> <span data-key="lessons">Lessons</span></a>
      <a href="live-classes.html"><i class="fas fa-video"></i> <span data-key="live">Live Classes</span></a>
      <a href="students.html"><i class="fas fa-users"></i> <span data-key="students">Students</span></a>
      <a href="assignments.html"><i class="fas fa-clipboard-list"></i> <span data-key="assignments">Assignments</span></a>
      <a href="exams.html"><i class="fas fa-file-alt"></i> <span data-key="exams">Exams</span></a>
      <a href="exam-results.html" class="active"><i class="fas fa-chart-bar"></i> <span data-key="results">Results</span></a>
      <a href="revenue.html"><i class="fas fa-dollar-sign"></i> <span data-key="revenue">Revenue</span></a>
      <a href="settings.html"><i class="fas fa-cog"></i> <span data-key="settings">Settings</span></a>
    </nav>
    <div class="sidebar-footer" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> <span data-key="logout">Logout</span>
    </div>
  </aside>

  <!-- Main -->
  <div class="main" id="mainContent">
    <header class="navbar">
      <div style="display:flex; align-items:center; gap:1rem; flex-wrap:wrap;">
        <h1 id="pageTitle">📊 Exam Results</h1>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search results...">
        </div>
      </div>
      <div class="navbar-actions">
        <div class="lang-dark">
          <button id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
          <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>
        <button><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
      </div>
    </header>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-file-alt"></i></div>
        <div class="stat-info"><h4 data-key="totalExams">Total Exams</h4><div class="value" id="totalExams">—</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
        <div class="stat-info"><h4 data-key="passRate">Pass Rate</h4><div class="value" id="passRate">—</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon amber"><i class="fas fa-chart-line"></i></div>
        <div class="stat-info"><h4 data-key="avgScore">Average Score</h4><div class="value" id="avgScore">—</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red"><i class="fas fa-star"></i></div>
        <div class="stat-info"><h4 data-key="highestScore">Highest Score</h4><div class="value" id="highestScore">—</div></div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3 data-key="scoreDistribution">Score Distribution</h3>
        <canvas id="scoreDistributionChart"></canvas>
      </div>
      <div class="chart-card">
        <h3 data-key="passFail">Pass vs Fail</h3>
        <canvas id="passFailChart"></canvas>
      </div>
    </div>

    <div class="table-wrapper">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th data-key="thStudent">Student</th>
              <th data-key="thExam">Exam</th>
              <th data-key="thScore">Score</th>
              <th data-key="thDate">Date</th>
              <th data-key="thStatus">Status</th>
            </tr>
          </thead>
          <tbody id="resultsTableBody">
            <tr><td colspan="5"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><br>Loading results...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { showToast, showLoading, hideLoading } from './shared.js';
    import { initOneSignal } from './onesignal.js';
    import {
      onAuthStateChanged,
      signOut
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';
    import {
      collection,
      query,
      orderBy,
      onSnapshot
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

    // Auth protection
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        console.log('✅ Logged in as:', user.email);
        document.body.classList.add('auth-ready');
        listenToResults();
      }
    });

    const searchInput = document.getElementById('searchInput');
    const tableBody = document.getElementById('resultsTableBody');
    const totalExamsEl = document.getElementById('totalExams');
    const passRateEl = document.getElementById('passRate');
    const avgScoreEl = document.getElementById('avgScore');
    const highestScoreEl = document.getElementById('highestScore');

    let allResults = [];
    let scoreDistributionChart, passFailChart;

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (confirm('Are you sure you want to logout?')) {
        try {
          await signOut(auth);
          window.location.href = 'login.html';
        } catch (error) {
          showToast('Logout failed.', 'error');
        }
      }
    });

    // Real-time listener
    function listenToResults() {
      showLoading();
      const q = query(collection(db, 'results'), orderBy('date', 'desc'));
      onSnapshot(q, (snapshot) => {
        allResults = [];
        snapshot.forEach((doc) => {
          allResults.push({ id: doc.id, ...doc.data() });
        });
        applyFilters();
        updateStatsAndCharts();
        hideLoading();
      }, (error) => {
        console.error('Error:', error);
        hideLoading();
        showToast('Failed to load results.', 'error');
        tableBody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>Failed to load data.</div></td></tr>`;
      });
    }

    function applyFilters() {
      const term = searchInput.value.toLowerCase();
      const filtered = allResults.filter(r =>
        (r.studentName && r.studentName.toLowerCase().includes(term)) ||
        (r.examTitle && r.examTitle.toLowerCase().includes(term))
      );
      renderTable(filtered);
    }

    searchInput.addEventListener('input', applyFilters);

    function renderTable(results) {
      if (results.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="fas fa-inbox"></i><p>No results found.</p></div></td></tr>`;
        return;
      }

      tableBody.innerHTML = results.map(r => {
        const dateStr = r.date
          ? new Date(r.date.seconds ? r.date.seconds * 1000 : r.date).toLocaleDateString()
          : '—';
        const scorePercent = r.totalMarks ? Math.round((r.score / r.totalMarks) * 100) : 0;
        const passed = r.passed !== undefined ? r.passed : (scorePercent >= 50);
        const statusBadge = passed
          ? '<span class="badge badge-success">Passed</span>'
          : '<span class="badge badge-danger">Failed</span>';
        return `
          <tr>
            <td><strong>${escapeHtml(r.studentName || '—')}</strong></td>
            <td>${escapeHtml(r.examTitle || '—')}</td>
            <td>${r.score} / ${r.totalMarks || '—'}</td>
            <td>${dateStr}</td>
            <td>${statusBadge}</td>
          </tr>`;
      }).join('');
    }

    function updateStatsAndCharts() {
      const total = allResults.length;
      totalExamsEl.textContent = total;

      if (total === 0) {
        passRateEl.textContent = '—';
        avgScoreEl.textContent = '—';
        highestScoreEl.textContent = '—';
        if (scoreDistributionChart) scoreDistributionChart.destroy();
        if (passFailChart) passFailChart.destroy();
        return;
      }

      const percentages = allResults.map(r => r.totalMarks ? (r.score / r.totalMarks) * 100 : 0);

      // Pass count
      const passedCount = allResults.filter(r => {
        const pct = r.totalMarks ? (r.score / r.totalMarks) * 100 : 0;
        return r.passed !== undefined ? r.passed : pct >= 50;
      }).length;
      const passRate = Math.round((passedCount / total) * 100);
      passRateEl.textContent = passRate + '%';

      // Average
      const avg = percentages.reduce((a, b) => a + b, 0) / total;
      avgScoreEl.textContent = Math.round(avg) + '%';

      // Highest
      const maxPct = Math.max(...percentages);
      highestScoreEl.textContent = Math.round(maxPct) + '%';

      // Score distribution
      const ranges = ['0-20%', '21-40%', '41-60%', '61-80%', '81-100%'];
      const counts = [0, 0, 0, 0, 0];
      percentages.forEach(p => {
        if (p <= 20) counts[0]++;
        else if (p <= 40) counts[1]++;
        else if (p <= 60) counts[2]++;
        else if (p <= 80) counts[3]++;
        else counts[4]++;
      });

      if (scoreDistributionChart) scoreDistributionChart.destroy();
      const ctx1 = document.getElementById('scoreDistributionChart').getContext('2d');
      scoreDistributionChart = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: ranges,
          datasets: [{
            label: 'Students',
            data: counts,
            backgroundColor: 'rgba(42,125,225,0.7)',
            borderColor: '#2a7de1',
            borderWidth: 1,
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
      });

      if (passFailChart) passFailChart.destroy();
      const ctx2 = document.getElementById('passFailChart').getContext('2d');
      passFailChart = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: ['Passed', 'Failed'],
          datasets: [{
            data: [passedCount, total - passedCount],
            backgroundColor: ['#10B981', '#EF4444'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        if (m === "'") return '&#039;';
        return m;
      });
    }

    // Language & Dark Mode
    let lang = 'en';
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const langLabel = document.getElementById('langLabel');
    const main = document.getElementById('mainContent');

    const translations = {
      en: {
        dashboard: 'Dashboard',
        courses: 'Courses',
        lessons: 'Lessons',
        live: 'Live Classes',
        students: 'Students',
        assignments: 'Assignments',
        exams: 'Exams',
        results: 'Results',
        revenue: 'Revenue',
        settings: 'Settings',
        logout: 'Logout',
        pageTitle: '📊 Exam Results',
        searchPlaceholder: 'Search results...',
        totalExams: 'Total Exams',
        passRate: 'Pass Rate',
        avgScore: 'Average Score',
        highestScore: 'Highest Score',
        scoreDistribution: 'Score Distribution',
        passFail: 'Pass vs Fail',
        thStudent: 'Student',
        thExam: 'Exam',
        thScore: 'Score',
        thDate: 'Date',
        thStatus: 'Status'
      },
      ar: {
        dashboard: 'لوحة التحكم',
        courses: 'الدورات',
        lessons: 'الدروس',
        live: 'الحصص المباشرة',
        students: 'الطلاب',
        assignments: 'الواجبات',
        exams: 'الامتحانات',
        results: 'النتائج',
        revenue: 'الإيرادات',
        settings: 'الإعدادات',
        logout: 'تسجيل الخروج',
        pageTitle: '📊 نتائج الامتحانات',
        searchPlaceholder: 'بحث في النتائج...',
        totalExams: 'إجمالي الامتحانات',
        passRate: 'نسبة النجاح',
        avgScore: 'متوسط الدرجات',
        highestScore: 'أعلى درجة',
        scoreDistribution: 'توزيع الدرجات',
        passFail: 'نجاح / رسوب',
        thStudent: 'الطالب',
        thExam: 'الامتحان',
        thScore: 'الدرجة',
        thDate: 'التاريخ',
        thStatus: 'الحالة'
      }
    };

    function applyLanguage(langCode) {
      const t = translations[langCode];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (t[key]) el.textContent = t[key];
      });
      document.getElementById('pageTitle').textContent = t.pageTitle;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      main.classList.toggle('rtl', langCode === 'ar');
    }

    langToggle.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      langLabel.textContent = lang.toUpperCase();
      applyLanguage(lang);
    });

    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      darkToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    // Init OneSignal
    initOneSignal();
    console.log('✅ Exam Results ready (production mode)');
  </script>
</body>
</html>
