<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · Exam Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;
      color: #0b1e33;
      display: flex;
      min-height: 100vh;
    }
    body.dark-mode { background: #0b0e14; color: #eef2f6; }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #ffffff;
      border-right: 1px solid #e7edf5;
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 1000;
      transition: transform 0.3s ease;
      transform: translateX(0);
    }
    body.dark-mode .sidebar { background: #141a26; border-right-color: #2a3442; }
    .sidebar.closed { transform: translateX(-100%); }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.5rem;
    }
    .sidebar-logo i {
      font-size: 1.8rem;
      color: #2a7de1;
      background: #e8f0fe;
      padding: 0.6rem;
      border-radius: 14px;
    }
    body.dark-mode .sidebar-logo i { background: #1f2a40; color: #6b9ef0; }
    .sidebar-logo span { font-weight: 700; font-size: 1.5rem; letter-spacing: -0.5px; }
    .sidebar-logo span small { color: #2a7de1; }
    .sidebar nav { flex: 1; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      color: #4a5b7a;
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
      margin-bottom: 0.3rem;
    }
    body.dark-mode .sidebar nav a { color: #b0c0d4; }
    .sidebar nav a i { width: 1.4rem; }
    .sidebar nav a:hover, .sidebar nav a.active {
      background: #eef4fe;
      color: #1a67c4;
    }
    body.dark-mode .sidebar nav a:hover, body.dark-mode .sidebar nav a.active {
      background: #1f2a40;
      color: #6b9ef0;
    }
    .sidebar-footer {
      border-top: 1px solid #e7edf5;
      padding-top: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #6b7d9c;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    body.dark-mode .sidebar-footer { border-top-color: #2a3442; }
    .sidebar-footer:hover { color: #e74c3c; }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 999;
    }
    .sidebar-overlay.show { display: block; }

    /* Main */
    .main {
      flex: 1;
      margin-left: 260px;
      padding: 1.8rem 2rem 2.5rem;
      transition: margin-left 0.3s ease;
      overflow-x: hidden;
      width: 100%;
    }
    .main.expanded { margin-left: 0; }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .navbar h1 { font-size: 1.7rem; font-weight: 700; }
    .navbar-actions { display: flex; align-items: center; gap: 1.2rem; }
    .navbar-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #4a5b7a;
      cursor: pointer;
    }
    body.dark-mode .navbar-actions button { color: #b0c0d4; }
    .navbar-actions button:hover { color: #2a7de1; }
    .lang-dark { display: flex; gap: 0.6rem; }
    .lang-dark button {
      background: none;
      border: none;
      font-weight: 600;
      color: #2a7de1;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lang-dark .dark-toggle { color: #6b7d9c; }
    body.dark-mode .lang-dark .dark-toggle { color: #b0c0d4; }
    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #4a5b7a;
      cursor: pointer;
    }
    body.dark-mode .hamburger { color: #b0c0d4; }

    .search-box {
      position: relative;
      max-width: 300px;
      width: 100%;
    }
    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      border: 1.5px solid #dfe6f0;
      border-radius: 40px;
      font-size: 0.9rem;
      background: #ffffff;
      color: #1a253a;
    }
    body.dark-mode .search-box input { background: #1a1f2b; border-color: #3b465b; color: #eef2f6; }
    .search-box input:focus { outline: none; border-color: #2a7de1; box-shadow: 0 0 0 3px rgba(42,125,225,0.1); }
    .search-box i {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: #8a9bb5;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 1.2rem;
      border: 1px solid #eef2f8;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    body.dark-mode .stat-card { background: #1a1f2b; border-color: #2a3442; }
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.3rem;
    }
    .stat-icon.blue { background: #2a7de1; }
    .stat-icon.green { background: #10B981; }
    .stat-icon.amber { background: #F59E0B; }
    .stat-icon.red { background: #EF4444; }
    .stat-info h4 {
      font-size: 0.8rem;
      color: #6b7d9c;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .stat-info .value { font-size: 1.5rem; font-weight: 700; margin-top: 0.2rem; }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .chart-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 1.5rem;
      border: 1px solid #eef2f8;
    }
    body.dark-mode .chart-card { background: #1a1f2b; border-color: #2a3442; }
    .chart-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }

    .table-wrapper {
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #eef2f8;
      overflow: hidden;
    }
    body.dark-mode .table-wrapper { background: #1a1f2b; border-color: #2a3442; }
    .table-responsive { overflow-x: auto; padding: 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead { background: #f9fbfe; border-bottom: 2px solid #eef2f8; }
    body.dark-mode thead { background: #141a26; border-bottom-color: #2a3442; }
    th {
      text-align: left;
      padding: 0.9rem 1rem;
      font-weight: 600;
      color: #4a5b7a;
      white-space: nowrap;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
    }
    body.dark-mode th { color: #b0c0d4; }
    td { padding: 0.9rem 1rem; border-bottom: 1px solid #eef2f8; vertical-align: middle; }
    body.dark-mode td { border-bottom-color: #2a3442; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(42,125,225,0.02); }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-success { background: #e3f5e9; color: #1f7840; }
    .badge-danger { background: #fde8e8; color: #b3403a; }

    .empty-state { text-align: center; padding: 3rem 1rem; color: #8a9bb5; }
    .empty-state i { font-size: 3rem; margin-bottom: 0.8rem; opacity: 0.5; }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .toast {
      padding: 0.8rem 1.5rem;
      border-radius: 14px;
      background: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: slideIn 0.3s ease;
    }
    body.dark-mode .toast { background: #2a3442; color: #eef2f6; }
    .toast.success { border-left: 4px solid #10B981; }
    .toast.error { border-left: 4px solid #EF4444; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    @media (max-width: 768px) {
      .hamburger { display: block; }
      .main { margin-left: 0; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.closed { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .charts-grid { grid-template-columns: 1fr; }
    }
    .rtl { direction: rtl; }
    .rtl .sidebar nav a { flex-direction: row-reverse; }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>Edu<small>Core</small></span>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
      <a href="courses.html"><i class="fas fa-book-open"></i> Courses</a>
      <a href="lessons.html"><i class="fas fa-file-alt"></i> Lessons</a>
      <a href="lesson-upload.html"><i class="fas fa-upload"></i> Upload Lesson</a>
      <a href="live-classes.html"><i class="fas fa-video"></i> Live Classes</a>
      <a href="students.html"><i class="fas fa-users"></i> Students</a>
      <a href="assignments.html"><i class="fas fa-clipboard-list"></i> Assignments</a>
      <a href="exams.html"><i class="fas fa-file-alt"></i> Exams</a>
      <a href="exam-results.html" class="active"><i class="fas fa-chart-bar"></i> Results</a>
      <a href="revenue.html"><i class="fas fa-dollar-sign"></i> Revenue</a>
      <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="sidebar-footer" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> Logout
    </div>
  </aside>

  <div class="main" id="mainContent">
    <header class="navbar">
      <div style="display:flex; align-items:center; gap:1rem; flex-wrap:wrap;">
        <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
        <h1>📊 Exam Results</h1>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search results...">
        </div>
      </div>
      <div class="navbar-actions">
        <div class="lang-dark">
          <button id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
          <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>
        <button><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
      </div>
    </header>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-file-alt"></i></div>
        <div class="stat-info"><h4>Total Exams</h4><div class="value" id="totalExams">—</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
        <div class="stat-info"><h4>Pass Rate</h4><div class="value" id="passRate">—</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon amber"><i class="fas fa-chart-line"></i></div>
        <div class="stat-info"><h4>Average Score</h4><div class="value" id="avgScore">—</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red"><i class="fas fa-star"></i></div>
        <div class="stat-info"><h4>Highest Score</h4><div class="value" id="highestScore">—</div></div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>Score Distribution</h3>
        <canvas id="scoreDistributionChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>Pass vs Fail</h3>
        <canvas id="passFailChart"></canvas>
      </div>
    </div>

    <div class="table-wrapper">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>Exam</th>
              <th>Score</th>
              <th>Date</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="resultsTableBody">
            <tr><td colspan="5"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><br>Loading results...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module">
    // ========== FIREBASE ==========
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      query,
      orderBy,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOBJ22snwOow8xfQnL2WmCusmyS8iWWlk",
      authDomain: "educore-c3b42.firebaseapp.com",
      projectId: "educore-c3b42",
      storageBucket: "educore-c3b42.firebasestorage.app",
      messagingSenderId: "750509780814",
      appId: "1:750509780814:web:f57bddff39c7668b3cf81f",
      measurementId: "G-LF317C03Q0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ========== AUTH ==========
    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = 'login.html';
      else {
        document.body.classList.add('auth-ready');
        listenToResults();
      }
    });

    // ========== MOBILE SIDEBAR ==========
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    document.getElementById('hamburgerBtn').addEventListener('click', () => {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });
    document.querySelectorAll('.sidebar nav a').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('show');
        }
      });
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('Are you sure you want to logout?')) {
        signOut(auth).then(() => window.location.href = 'login.html');
      }
    });

    // ========== TOAST ==========
    function showToast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ========== DATA ==========
    const searchInput = document.getElementById('searchInput');
    const tableBody = document.getElementById('resultsTableBody');
    const totalExamsEl = document.getElementById('totalExams');
    const passRateEl = document.getElementById('passRate');
    const avgScoreEl = document.getElementById('avgScore');
    const highestScoreEl = document.getElementById('highestScore');

    let allResults = [];
    let scoreDistributionChart, passFailChart;

    // Real-time listener
    function listenToResults() {
      const q = query(collection(db, 'results'), orderBy('date', 'desc'));
      onSnapshot(q, (snapshot) => {
        allResults = [];
        snapshot.forEach((doc) => allResults.push({ id: doc.id, ...doc.data() }));
        applyFilters();
        updateStatsAndCharts();
      }, (error) => {
        console.error(error);
        showToast('Failed to load results', 'error');
        tableBody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>Failed to load data.</div></td></tr>`;
      });
    }

    function applyFilters() {
      const term = searchInput.value.toLowerCase();
      const filtered = allResults.filter(r =>
        (r.studentName && r.studentName.toLowerCase().includes(term)) ||
        (r.examTitle && r.examTitle.toLowerCase().includes(term))
      );
      renderTable(filtered);
    }

    searchInput.addEventListener('input', applyFilters);

    function renderTable(results) {
      if (results.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="fas fa-inbox"></i><p>No results found.</p></div></td></tr>`;
        return;
      }

      tableBody.innerHTML = results.map(r => {
        const dateStr = r.date ? new Date(r.date.seconds ? r.date.seconds * 1000 : r.date).toLocaleDateString() : '—';
        const scorePercent = r.totalMarks ? Math.round((r.score / r.totalMarks) * 100) : 0;
        const passed = r.passed !== undefined ? r.passed : (scorePercent >= 50);
        const statusBadge = passed ? '<span class="badge badge-success">Passed</span>' : '<span class="badge badge-danger">Failed</span>';
        return `
          <tr>
            <td><strong>${escapeHtml(r.studentName || '—')}</strong></td>
            <td>${escapeHtml(r.examTitle || '—')}</td>
            <td>${r.score} / ${r.totalMarks || '—'}</td>
            <td>${dateStr}</td>
            <td>${statusBadge}</td>
          </tr>`;
      }).join('');
    }

    function updateStatsAndCharts() {
      const total = allResults.length;
      totalExamsEl.textContent = total;

      if (total === 0) {
        passRateEl.textContent = '—';
        avgScoreEl.textContent = '—';
        highestScoreEl.textContent = '—';
        if (scoreDistributionChart) scoreDistributionChart.destroy();
        if (passFailChart) passFailChart.destroy();
        return;
      }

      const percentages = allResults.map(r => r.totalMarks ? (r.score / r.totalMarks) * 100 : 0);

      const passedCount = allResults.filter(r => {
        const pct = r.totalMarks ? (r.score / r.totalMarks) * 100 : 0;
        return r.passed !== undefined ? r.passed : pct >= 50;
      }).length;

      const passRate = Math.round((passedCount / total) * 100);
      passRateEl.textContent = passRate + '%';

      const avg = percentages.reduce((a, b) => a + b, 0) / total;
      avgScoreEl.textContent = Math.round(avg) + '%';

      const maxPct = Math.max(...percentages);
      highestScoreEl.textContent = Math.round(maxPct) + '%';

      // Score Distribution
      const ranges = ['0-20%', '21-40%', '41-60%', '61-80%', '81-100%'];
      const counts = [0, 0, 0, 0, 0];
      percentages.forEach(p => {
        if (p <= 20) counts[0]++;
        else if (p <= 40) counts[1]++;
        else if (p <= 60) counts[2]++;
        else if (p <= 80) counts[3]++;
        else counts[4]++;
      });

      if (scoreDistributionChart) scoreDistributionChart.destroy();
      const ctx1 = document.getElementById('scoreDistributionChart').getContext('2d');
      scoreDistributionChart = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: ranges,
          datasets: [{
            label: 'Students',
            data: counts,
            backgroundColor: 'rgba(42,125,225,0.7)',
            borderColor: '#2a7de1',
            borderWidth: 1,
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
      });

      if (passFailChart) passFailChart.destroy();
      const ctx2 = document.getElementById('passFailChart').getContext('2d');
      passFailChart = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: ['Passed', 'Failed'],
          datasets: [{
            data: [passedCount, total - passedCount],
            backgroundColor: ['#10B981', '#EF4444'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, m => {
        if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;';
        if (m === '"') return '&quot;'; if (m === "'") return '&#039;'; return m;
      });
    }

    // ========== LANGUAGE & DARK MODE ==========
    let lang = 'en';
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const langLabel = document.getElementById('langLabel');
    const mainEl = document.getElementById('mainContent');

    langToggle.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      langLabel.textContent = lang.toUpperCase();
      if (lang === 'ar') {
        document.querySelector('.navbar h1').textContent = '📊 نتائج الامتحانات';
        document.getElementById('searchInput').placeholder = 'بحث في النتائج...';
        document.querySelectorAll('.stat-card')[0].querySelector('h4').textContent = 'إجمالي الامتحانات';
        document.querySelectorAll('.stat-card')[1].querySelector('h4').textContent = 'نسبة النجاح';
        document.querySelectorAll('.stat-card')[2].querySelector('h4').textContent = 'متوسط الدرجات';
        document.querySelectorAll('.stat-card')[3].querySelector('h4').textContent = 'أعلى درجة';
        document.querySelectorAll('.chart-card h3')[0].textContent = 'توزيع الدرجات';
        document.querySelectorAll('.chart-card h3')[1].textContent = 'نجاح / رسوب';
        document.querySelectorAll('th')[0].textContent = 'الطالب';
        document.querySelectorAll('th')[1].textContent = 'الامتحان';
        document.querySelectorAll('th')[2].textContent = 'الدرجة';
        document.querySelectorAll('th')[3].textContent = 'التاريخ';
        document.querySelectorAll('th')[4].textContent = 'الحالة';
        mainEl.classList.add('rtl');
      } else {
        document.querySelector('.navbar h1').textContent = '📊 Exam Results';
        document.getElementById('searchInput').placeholder = 'Search results...';
        document.querySelectorAll('.stat-card')[0].querySelector('h4').textContent = 'Total Exams';
        document.querySelectorAll('.stat-card')[1].querySelector('h4').textContent = 'Pass Rate';
        document.querySelectorAll('.stat-card')[2].querySelector('h4').textContent = 'Average Score';
        document.querySelectorAll('.stat-card')[3].querySelector('h4').textContent = 'Highest Score';
        document.querySelectorAll('.chart-card h3')[0].textContent = 'Score Distribution';
        document.querySelectorAll('.chart-card h3')[1].textContent = 'Pass vs Fail';
        document.querySelectorAll('th')[0].textContent = 'Student';
        document.querySelectorAll('th')[1].textContent = 'Exam';
        document.querySelectorAll('th')[2].textContent = 'Score';
        document.querySelectorAll('th')[3].textContent = 'Date';
        document.querySelectorAll('th')[4].textContent = 'Status';
        mainEl.classList.remove('rtl');
      }
    });

    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      darkToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    console.log('✅ Exam Results ready.');
  </script>
</body>
</html>
