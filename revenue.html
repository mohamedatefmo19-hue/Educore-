<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · Revenue</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Shared styles -->
  <link rel="stylesheet" href="shared.css">

  <style>
    body {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, border 0.2s;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 10;
    }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.5rem;
    }
    .sidebar-logo i {
      font-size: 1.8rem;
      color: var(--primary);
      background: rgba(42,125,225,0.1);
      padding: 0.6rem;
      border-radius: 14px;
    }
    .sidebar-logo span {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .sidebar-logo span small { color: var(--primary); }
    .sidebar nav { flex: 1; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
      margin-bottom: 0.3rem;
    }
    .sidebar nav a i { width: 1.4rem; }
    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: rgba(42,125,225,0.1);
      color: var(--primary);
    }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: 0.15s;
    }
    .sidebar-footer:hover { color: #e74c3c; }

    /* Main */
    .main {
      flex: 1;
      padding: 1.8rem 2rem 2.5rem;
      overflow-x: hidden;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .navbar h1 { font-size: 1.7rem; font-weight: 700; }
    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .navbar-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.15s;
    }
    .navbar-actions button:hover { color: var(--primary); }
    .lang-dark { display: flex; gap: 0.6rem; }
    .lang-dark button {
      background: none;
      border: none;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lang-dark .dark-toggle { color: var(--text-secondary); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--bg); color: var(--text); }
    .btn-secondary:hover { background: var(--border); }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.2rem;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.3rem;
    }
    .stat-icon.blue { background: var(--primary); }
    .stat-icon.green { background: #10B981; }
    .stat-icon.amber { background: #F59E0B; }
    .stat-info h4 {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .stat-info .value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 0.2rem;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .chart-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      border: 1px solid var(--border);
    }
    .chart-card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .table-wrapper {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .table-responsive { overflow-x: auto; padding: 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead { background: var(--bg); border-bottom: 2px solid var(--border); }
    th {
      text-align: left;
      padding: 0.9rem 1rem;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
    }
    td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(42,125,225,0.02); }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-success { background: #e3f5e9; color: #1f7840; }
    .badge-warning { background: #fef3e2; color: #b9770e; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-secondary);
    }
    .empty-state i { font-size: 3rem; margin-bottom: 0.8rem; opacity: 0.5; }

    .rtl { direction: rtl; }
    .rtl .sidebar nav a { flex-direction: row-reverse; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 1.2rem; }
      .charts-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>Edu<small>Core</small></span>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-chart-pie"></i> <span data-key="dashboard">Dashboard</span></a>
      <a href="courses.html"><i class="fas fa-book-open"></i> <span data-key="courses">Courses</span></a>
      <a href="lessons.html"><i class="fas fa-file-alt"></i> <span data-key="lessons">Lessons</span></a>
      <a href="live-classes.html"><i class="fas fa-video"></i> <span data-key="live">Live Classes</span></a>
      <a href="students.html"><i class="fas fa-users"></i> <span data-key="students">Students</span></a>
      <a href="assignments.html"><i class="fas fa-clipboard-list"></i> <span data-key="assignments">Assignments</span></a>
      <a href="exams.html"><i class="fas fa-file-alt"></i> <span data-key="exams">Exams</span></a>
      <a href="exam-results.html"><i class="fas fa-chart-bar"></i> <span data-key="results">Results</span></a>
      <a href="notifications.html"><i class="fas fa-bell"></i> <span data-key="notifications">Notifications</span></a>
      <a href="messages.html"><i class="fas fa-comments"></i> <span data-key="messages">Messages</span></a>
      <a href="revenue.html" class="active"><i class="fas fa-dollar-sign"></i> <span data-key="revenue">Revenue</span></a>
      <a href="settings.html"><i class="fas fa-cog"></i> <span data-key="settings">Settings</span></a>
    </nav>
    <div class="sidebar-footer" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> <span data-key="logout">Logout</span>
    </div>
  </aside>

  <!-- Main -->
  <div class="main" id="mainContent">
    <header class="navbar">
      <div style="display:flex; justify-content:space-between; align-items:center; width:100%; flex-wrap:wrap; gap:1rem;">
        <h1 id="pageTitle">💰 Revenue</h1>
        <div style="display:flex; gap:1rem; align-items:center;">
          <button class="btn btn-primary" id="exportReportBtn">
            <i class="fas fa-download"></i> Export Report
          </button>
          <div class="navbar-actions">
            <div class="lang-dark">
              <button id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
              <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
            </div>
            <button><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
          </div>
        </div>
      </div>
    </header>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-dollar-sign"></i></div>
        <div class="stat-info"><h4 data-key="totalRevenue">Total Revenue</h4><div class="value" id="totalRevenue">—</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-chart-line"></i></div>
        <div class="stat-info"><h4 data-key="monthlyRevenue">This Month</h4><div class="value" id="monthlyRevenue">—</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon amber"><i class="fas fa-users"></i></div>
        <div class="stat-info"><h4 data-key="totalPayments">Total Payments</h4><div class="value" id="totalPayments">—</div></div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3 data-key="monthlyRevenueChart">Monthly Revenue</h3>
        <canvas id="monthlyRevenueChart"></canvas>
      </div>
      <div class="chart-card">
        <h3 data-key="paymentStatusChart">Payment Status</h3>
        <canvas id="paymentStatusChart"></canvas>
      </div>
    </div>

    <div class="table-wrapper">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th data-key="thStudent">Student</th>
              <th data-key="thCourse">Course</th>
              <th data-key="thAmount">Amount</th>
              <th data-key="thDate">Date</th>
              <th data-key="thStatus">Status</th>
            </tr>
          </thead>
          <tbody id="paymentsTableBody">
            <tr><td colspan="5"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><br>Loading payments...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { showToast, showLoading, hideLoading } from './shared.js';
    import { initOneSignal } from './onesignal.js';
    import {
      onAuthStateChanged,
      signOut
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';
    import {
      collection,
      query,
      orderBy,
      onSnapshot
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

    // Auth protection
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        console.log('✅ Logged in as:', user.email);
        document.body.classList.add('auth-ready');
        listenToPayments();
      }
    });

    const tableBody = document.getElementById('paymentsTableBody');
    const totalRevenueEl = document.getElementById('totalRevenue');
    const monthlyRevenueEl = document.getElementById('monthlyRevenue');
    const totalPaymentsEl = document.getElementById('totalPayments');

    let allPayments = [];
    let monthlyRevenueChart, paymentStatusChart;

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (confirm('Are you sure you want to logout?')) {
        try {
          await signOut(auth);
          window.location.href = 'login.html';
        } catch (error) {
          showToast('Logout failed.', 'error');
        }
      }
    });

    // Real-time listener
    function listenToPayments() {
      showLoading();
      const q = query(collection(db, 'payments'), orderBy('date', 'desc'));
      onSnapshot(q, (snapshot) => {
        allPayments = [];
        snapshot.forEach((doc) => {
          allPayments.push({ id: doc.id, ...doc.data() });
        });
        updateUI();
        hideLoading();
      }, (error) => {
        console.error('Error:', error);
        hideLoading();
        showToast('Failed to load payments.', 'error');
        tableBody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>Failed to load data.</div></td></tr>`;
      });
    }

    function updateUI() {
      calculateStats();
      renderPaymentsTable();
      updateCharts();
    }

    function calculateStats() {
      const totalRevenue = allPayments
        .filter(p => p.status === 'paid')
        .reduce((sum, p) => sum + (p.amount || 0), 0);
      totalRevenueEl.textContent = '$' + totalRevenue.toLocaleString('en-US', { minimumFractionDigits: 0 });

      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();
      const monthlyTotal = allPayments
        .filter(p => {
          if (!p.date) return false;
          const d = p.date?.toDate ? p.date.toDate() : new Date(p.date.seconds * 1000);
          return d.getMonth() === currentMonth && d.getFullYear() === currentYear && p.status === 'paid';
        })
        .reduce((sum, p) => sum + (p.amount || 0), 0);
      monthlyRevenueEl.textContent = '$' + monthlyTotal.toLocaleString('en-US', { minimumFractionDigits: 0 });

      totalPaymentsEl.textContent = allPayments.filter(p => p.status === 'paid').length;
    }

    function renderPaymentsTable() {
      if (allPayments.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="fas fa-inbox"></i><p>No payments recorded yet.</p></div></td></tr>`;
        return;
      }

      tableBody.innerHTML = allPayments.map(p => {
        const dateStr = p.date
          ? new Date(p.date.seconds ? p.date.seconds * 1000 : p.date).toLocaleDateString()
          : '—';
        const statusBadge = p.status === 'paid' ? 'badge-success' : 'badge-warning';
        return `
          <tr>
            <td><strong>${escapeHtml(p.studentName || '—')}</strong></td>
            <td>${escapeHtml(p.course || '—')}</td>
            <td>$${(p.amount || 0).toFixed(2)}</td>
            <td>${dateStr}</td>
            <td><span class="badge ${statusBadge}">${p.status || 'pending'}</span></td>
          </tr>`;
      }).join('');
    }

    function updateCharts() {
      // Monthly Revenue Chart
      const monthlyMap = new Map();
      allPayments.filter(p => p.status === 'paid').forEach(p => {
        if (!p.date) return;
        const d = p.date?.toDate ? p.date.toDate() : new Date(p.date.seconds * 1000);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        monthlyMap.set(key, (monthlyMap.get(key) || 0) + (p.amount || 0));
      });

      const sortedKeys = Array.from(monthlyMap.keys()).sort();
      const labels = sortedKeys.map(k => {
        const [year, month] = k.split('-');
        return new Date(year, month - 1).toLocaleString('default', { month: 'short' }) + ' ' + year;
      });
      const data = sortedKeys.map(k => monthlyMap.get(k));

      if (monthlyRevenueChart) monthlyRevenueChart.destroy();
      const ctx1 = document.getElementById('monthlyRevenueChart').getContext('2d');
      monthlyRevenueChart = new Chart(ctx1, {
        type: 'line',
        data: {
          labels: labels.length ? labels : ['No data'],
          datasets: [{
            label: 'Revenue',
            data: data.length ? data : [0],
            borderColor: '#2a7de1',
            backgroundColor: 'rgba(42,125,225,0.1)',
            fill: true,
            tension: 0.3,
            pointBackgroundColor: '#2a7de1'
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } }
        }
      });

      // Payment Status Chart
      const paidCount = allPayments.filter(p => p.status === 'paid').length;
      const pendingCount = allPayments.filter(p => p.status === 'pending').length;

      if (paymentStatusChart) paymentStatusChart.destroy();
      const ctx2 = document.getElementById('paymentStatusChart').getContext('2d');
      paymentStatusChart = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: ['Paid', 'Pending'],
          datasets: [{
            data: [paidCount, pendingCount],
            backgroundColor: ['#10B981', '#F59E0B']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }

    // Export CSV
    document.getElementById('exportReportBtn').addEventListener('click', () => {
      if (allPayments.length === 0) {
        showToast('No data to export.', 'error');
        return;
      }
      let csv = 'Student,Course,Amount,Date,Status\n';
      allPayments.forEach(p => {
        const dateStr = p.date
          ? new Date(p.date.seconds ? p.date.seconds * 1000 : p.date).toISOString()
          : '';
        csv += `"${p.studentName || ''}","${p.course || ''}",${p.amount || 0},"${dateStr}","${p.status || 'pending'}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'revenue_report.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Report exported!', 'success');
    });

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        if (m === "'") return '&#039;';
        return m;
      });
    }

    // Language & Dark Mode
    let lang = 'en';
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const langLabel = document.getElementById('langLabel');
    const main = document.getElementById('mainContent');

    const translations = {
      en: {
        dashboard: 'Dashboard',
        courses: 'Courses',
        lessons: 'Lessons',
        live: 'Live Classes',
        students: 'Students',
        assignments: 'Assignments',
        exams: 'Exams',
        results: 'Results',
        notifications: 'Notifications',
        messages: 'Messages',
        revenue: 'Revenue',
        settings: 'Settings',
        logout: 'Logout',
        pageTitle: '💰 Revenue',
        exportBtn: '<i class="fas fa-download"></i> Export Report',
        totalRevenue: 'Total Revenue',
        monthlyRevenue: 'This Month',
        totalPayments: 'Total Payments',
        monthlyRevenueChart: 'Monthly Revenue',
        paymentStatusChart: 'Payment Status',
        thStudent: 'Student',
        thCourse: 'Course',
        thAmount: 'Amount',
        thDate: 'Date',
        thStatus: 'Status'
      },
      ar: {
        dashboard: 'لوحة التحكم',
        courses: 'الدورات',
        lessons: 'الدروس',
        live: 'الحصص المباشرة',
        students: 'الطلاب',
        assignments: 'الواجبات',
        exams: 'الامتحانات',
        results: 'النتائج',
        notifications: 'الإشعارات',
        messages: 'الرسائل',
        revenue: 'الإيرادات',
        settings: 'الإعدادات',
        logout: 'تسجيل الخروج',
        pageTitle: '💰 الإيرادات',
        exportBtn: '<i class="fas fa-download"></i> تصدير التقرير',
        totalRevenue: 'إجمالي الإيرادات',
        monthlyRevenue: 'هذا الشهر',
        totalPayments: 'إجمالي المدفوعات',
        monthlyRevenueChart: 'الإيرادات الشهرية',
        paymentStatusChart: 'حالة الدفع',
        thStudent: 'الطالب',
        thCourse: 'الدورة',
        thAmount: 'المبلغ',
        thDate: 'التاريخ',
        thStatus: 'الحالة'
      }
    };

    function applyLanguage(langCode) {
      const t = translations[langCode];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (t[key]) el.textContent = t[key];
      });
      document.getElementById('pageTitle').textContent = t.pageTitle;
      document.getElementById('exportReportBtn').innerHTML = t.exportBtn;
      main.classList.toggle('rtl', langCode === 'ar');
    }

    langToggle.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      langLabel.textContent = lang.toUpperCase();
      applyLanguage(lang);
    });

    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      darkToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    // Init OneSignal
    initOneSignal();
    console.log('✅ Revenue ready (production mode)');
  </script>
</body>
</html>
