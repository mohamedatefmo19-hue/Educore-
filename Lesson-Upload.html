<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · Upload Lesson</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Cloudinary Upload Widget -->
  <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;
      color: #0b1e33;
      display: flex;
      min-height: 100vh;
    }
    body.dark-mode { background: #0b0e14; color: #eef2f6; }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #ffffff;
      border-right: 1px solid #e7edf5;
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 1000;
      transition: transform 0.3s ease;
      transform: translateX(0);
    }
    body.dark-mode .sidebar { background: #141a26; border-right-color: #2a3442; }
    .sidebar.closed { transform: translateX(-100%); }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.5rem;
    }
    .sidebar-logo i {
      font-size: 1.8rem;
      color: #2a7de1;
      background: #e8f0fe;
      padding: 0.6rem;
      border-radius: 14px;
    }
    body.dark-mode .sidebar-logo i { background: #1f2a40; color: #6b9ef0; }
    .sidebar-logo span { font-weight: 700; font-size: 1.5rem; letter-spacing: -0.5px; }
    .sidebar-logo span small { color: #2a7de1; }
    .sidebar nav { flex: 1; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      color: #4a5b7a;
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
      margin-bottom: 0.3rem;
    }
    body.dark-mode .sidebar nav a { color: #b0c0d4; }
    .sidebar nav a i { width: 1.4rem; }
    .sidebar nav a:hover, .sidebar nav a.active {
      background: #eef4fe;
      color: #1a67c4;
    }
    body.dark-mode .sidebar nav a:hover, body.dark-mode .sidebar nav a.active {
      background: #1f2a40;
      color: #6b9ef0;
    }
    .sidebar-footer {
      border-top: 1px solid #e7edf5;
      padding-top: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #6b7d9c;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    body.dark-mode .sidebar-footer { border-top-color: #2a3442; }
    .sidebar-footer:hover { color: #e74c3c; }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 999;
    }
    .sidebar-overlay.show { display: block; }

    /* Main */
    .main {
      flex: 1;
      margin-left: 260px;
      padding: 1.8rem 2rem 2.5rem;
      transition: margin-left 0.3s ease;
      overflow-x: hidden;
      width: 100%;
    }
    .main.expanded { margin-left: 0; }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .navbar h1 { font-size: 1.7rem; font-weight: 700; }
    .navbar-actions { display: flex; align-items: center; gap: 1.2rem; }
    .navbar-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #4a5b7a;
      cursor: pointer;
    }
    body.dark-mode .navbar-actions button { color: #b0c0d4; }
    .navbar-actions button:hover { color: #2a7de1; }
    .lang-dark { display: flex; gap: 0.6rem; }
    .lang-dark button {
      background: none;
      border: none;
      font-weight: 600;
      color: #2a7de1;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lang-dark .dark-toggle { color: #6b7d9c; }
    body.dark-mode .lang-dark .dark-toggle { color: #b0c0d4; }
    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #4a5b7a;
      cursor: pointer;
    }
    body.dark-mode .hamburger { color: #b0c0d4; }

    .upload-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 2rem;
      border: 1px solid #eef2f8;
      max-width: 800px;
      margin: 0 auto;
    }
    body.dark-mode .upload-card { background: #1a1f2b; border-color: #2a3442; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
    }
    .form-group label .required { color: #e74c3c; margin-left: 0.2rem; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid #dfe6f0;
      border-radius: 14px;
      font-size: 0.95rem;
      background: #f9fbfe;
      transition: 0.15s;
    }
    body.dark-mode .form-group input, body.dark-mode .form-group textarea, body.dark-mode .form-group select {
      background: #252d3d;
      border-color: #3b465b;
      color: #eef2f6;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none;
      border-color: #2a7de1;
      box-shadow: 0 0 0 4px rgba(42,125,225,0.1);
    }

    .upload-area {
      border: 2px dashed #dfe6f0;
      border-radius: 14px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
      background: #f9fbfe;
    }
    body.dark-mode .upload-area { background: #252d3d; border-color: #3b465b; }
    .upload-area:hover { border-color: #2a7de1; background: #eef4fe; }
    .upload-area i { font-size: 2rem; color: #2a7de1; opacity: 0.6; margin-bottom: 0.5rem; }
    .upload-area .file-info { font-size: 0.85rem; color: #6b7d9c; }
    .upload-preview { margin-top: 0.8rem; display: none; }
    .upload-preview img, .upload-preview video {
      max-width: 100%;
      max-height: 200px;
      border-radius: 12px;
      border: 1px solid #dfe6f0;
    }
    .upload-preview .file-link {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #2a7de1;
      word-break: break-all;
    }

    .checkbox-group { display: flex; align-items: center; gap: 0.7rem; padding: 0.5rem 0; }
    .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; accent-color: #2a7de1; }

    .btn-primary {
      background: #2a7de1;
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: center;
      text-decoration: none;
    }
    .btn-primary:hover { background: #1a67c4; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: #eef2f8;
      color: #1a253a;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }
    body.dark-mode .btn-secondary { background: #2a3442; color: #eef2f6; }
    .btn-secondary:hover { background: #dfe6f0; }

    .form-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .toast {
      padding: 0.8rem 1.5rem;
      border-radius: 14px;
      background: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: slideIn 0.3s ease;
    }
    body.dark-mode .toast { background: #2a3442; color: #eef2f6; }
    .toast.success { border-left: 4px solid #10B981; }
    .toast.error { border-left: 4px solid #EF4444; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .action-bar { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }

    @media (max-width: 768px) {
      .hamburger { display: block; }
      .main { margin-left: 0; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.closed { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .upload-card { padding: 1.2rem; }
    }
    @media (max-width: 480px) {
      .form-actions { flex-direction: column; }
      .action-bar { flex-direction: column; }
    }
    .rtl { direction: rtl; }
    .rtl .sidebar nav a { flex-direction: row-reverse; }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>Edu<small>Core</small></span>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
      <a href="courses.html"><i class="fas fa-book-open"></i> Courses</a>
      <a href="lessons.html"><i class="fas fa-file-alt"></i> Lessons</a>
      <a href="lesson-upload.html" class="active"><i class="fas fa-upload"></i> Upload Lesson</a>
      <a href="students.html"><i class="fas fa-users"></i> Students</a>
      <a href="live-classes.html"><i class="fas fa-video"></i> Live Classes</a>
      <a href="revenue.html"><i class="fas fa-dollar-sign"></i> Revenue</a>
      <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="sidebar-footer" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> Logout
    </div>
  </aside>

  <div class="main" id="mainContent">
    <header class="navbar">
      <div style="display:flex; align-items:center; gap:1rem;">
        <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
        <h1>📤 Upload Lesson</h1>
      </div>
      <div class="navbar-actions">
        <div class="lang-dark">
          <button id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
          <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>
        <button><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
      </div>
    </header>

    <div class="action-bar">
      <a href="#" id="backToLessonsBtn" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back to Lessons</a>
    </div>

    <div class="upload-card">
      <form id="uploadForm">
        <div class="form-group">
          <label>Lesson Title <span class="required">*</span></label>
          <input type="text" id="formTitle" required placeholder="Enter lesson title">
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="formDesc" rows="3" placeholder="Brief description of the lesson"></textarea>
        </div>

        <div class="form-group">
          <label>Select Course <span class="required">*</span></label>
          <select id="formCourse" required>
            <option value="">-- Select a course --</option>
          </select>
        </div>

        <div class="form-group">
          <label>Video <span class="required">*</span></label>
          <div class="upload-area" id="videoUploadBtn">
            <i class="fas fa-video"></i>
            <div class="file-info">Click to upload video (MP4, MOV)</div>
            <div class="upload-preview" id="videoPreview">
              <video controls src="" id="videoPreviewEl"></video>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>PDF (Optional)</label>
          <div class="upload-area" id="pdfUploadBtn">
            <i class="fas fa-file-pdf"></i>
            <div class="file-info">Click to upload PDF</div>
            <div class="upload-preview" id="pdfPreview">
              <a href="#" target="_blank" class="file-link" id="pdfLink"></a>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Thumbnail (Optional)</label>
          <div class="upload-area" id="thumbUploadBtn">
            <i class="fas fa-image"></i>
            <div class="file-info">Click to upload thumbnail (JPG, PNG)</div>
            <div class="upload-preview" id="thumbPreview">
              <img src="" alt="Thumbnail preview" id="thumbPreviewImg">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Schedule Publish</label>
          <input type="datetime-local" id="formSchedule">
        </div>

        <div class="form-group">
          <label>Lesson Type</label>
          <div class="checkbox-group">
            <input type="checkbox" id="formFree" checked>
            <label for="formFree" style="margin:0;font-weight:500;">Free Lesson</label>
          </div>
          <div style="margin-top:0.5rem;display:none;" id="priceContainer">
            <input type="number" id="formPrice" placeholder="Price ($)" step="0.01" min="0">
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" id="resetBtn">Reset</button>
          <button type="submit" class="btn-primary" id="submitBtn">
            <i class="fas fa-cloud-upload-alt"></i> Upload Lesson
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module">
    // ========== FIREBASE ==========
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      getDocs,
      addDoc,
      Timestamp
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOBJ22snwOow8xfQnL2WmCusmyS8iWWlk",
      authDomain: "educore-c3b42.firebaseapp.com",
      projectId: "educore-c3b42",
      storageBucket: "educore-c3b42.firebasestorage.app",
      messagingSenderId: "750509780814",
      appId: "1:750509780814:web:f57bddff39c7668b3cf81f",
      measurementId: "G-LF317C03Q0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ========== AUTH ==========
    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = 'login.html';
      else {
        document.body.classList.add('auth-ready');
        loadCourses();
      }
    });

    // ========== MOBILE SIDEBAR ==========
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    document.getElementById('hamburgerBtn').addEventListener('click', () => {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });
    document.querySelectorAll('.sidebar nav a').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('show');
        }
      });
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('Are you sure you want to logout?')) {
        signOut(auth).then(() => window.location.href = 'login.html');
      }
    });

    // ========== TOAST ==========
    function showToast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ========== CLOUDINARY ==========
    const cloudName = "deaevfmvm";
    const uploadPreset = "ml_default";

    function openCloudinaryUpload(resourceType, folder, onSuccess) {
      if (!window.cloudinary) {
        showToast('Cloudinary not loaded', 'error');
        return;
      }
      const widget = window.cloudinary.createUploadWidget({
        cloudName,
        uploadPreset,
        sources: ['local', 'url', 'camera'],
        multiple: false,
        resourceType: resourceType === 'video' ? 'video' : 'image',
        clientAllowedFormats: resourceType === 'video' ? ['mp4', 'mov'] : (resourceType === 'image' ? ['png', 'jpg', 'jpeg', 'gif'] : ['pdf']),
        maxFileSize: resourceType === 'video' ? 200000000 : 10000000
      }, (error, result) => {
        if (!error && result && result.event === "success") {
          onSuccess(result.info.secure_url);
        }
        if (error) {
          showToast('Upload failed: ' + error, 'error');
        }
      });
      widget.open();
    }

    // ========== FILE UPLOAD HANDLERS ==========
    let uploadedVideoUrl = null;
    let uploadedPdfUrl = null;
    let uploadedThumbUrl = null;

    const videoPreview = document.getElementById('videoPreview');
    const videoPreviewEl = document.getElementById('videoPreviewEl');
    const pdfPreview = document.getElementById('pdfPreview');
    const pdfLink = document.getElementById('pdfLink');
    const thumbPreview = document.getElementById('thumbPreview');
    const thumbPreviewImg = document.getElementById('thumbPreviewImg');

    document.getElementById('videoUploadBtn').addEventListener('click', () => {
      openCloudinaryUpload('video', 'videos', (url) => {
        uploadedVideoUrl = url;
        videoPreviewEl.src = url;
        videoPreview.style.display = 'block';
        showToast('Video uploaded!', 'success');
      });
    });

    document.getElementById('pdfUploadBtn').addEventListener('click', () => {
      openCloudinaryUpload('image', 'documents', (url) => {
        uploadedPdfUrl = url;
        pdfLink.href = url;
        pdfLink.textContent = 'View PDF';
        pdfPreview.style.display = 'block';
        showToast('PDF uploaded!', 'success');
      });
    });

    document.getElementById('thumbUploadBtn').addEventListener('click', () => {
      openCloudinaryUpload('image', 'lesson-thumbnails', (url) => {
        uploadedThumbUrl = url;
        thumbPreviewImg.src = url;
        thumbPreview.style.display = 'block';
        showToast('Thumbnail uploaded!', 'success');
      });
    });

    // ========== COURSES ==========
    const formCourse = document.getElementById('formCourse');
    const backToLessonsBtn = document.getElementById('backToLessonsBtn');
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('courseId');

    async function loadCourses() {
      try {
        const snap = await getDocs(collection(db, 'courses'));
        formCourse.innerHTML = '<option value="">-- Select a course --</option>';
        snap.forEach(doc => {
          const c = doc.data();
          formCourse.innerHTML += `<option value="${doc.id}">${c.title || 'Untitled'}</option>`;
        });
        if (courseId) formCourse.value = courseId;
        backToLessonsBtn.href = courseId ? `lessons.html?courseId=${courseId}` : 'lessons.html';
      } catch (e) {
        showToast('Failed to load courses', 'error');
      }
    }

    // ========== FORM SUBMIT ==========
    const form = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const formFree = document.getElementById('formFree');
    const priceContainer = document.getElementById('priceContainer');
    const resetBtn = document.getElementById('resetBtn');

    formFree.addEventListener('change', () => {
      priceContainer.style.display = formFree.checked ? 'none' : 'block';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('formTitle').value.trim();
      const selectedCourseId = formCourse.value;

      if (!title) { showToast('Please enter a lesson title', 'error'); return; }
      if (!selectedCourseId) { showToast('Please select a course', 'error'); return; }
      if (!uploadedVideoUrl) { showToast('Please upload a video', 'error'); return; }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

      try {
        const lessonData = {
          title,
          description: document.getElementById('formDesc').value.trim(),
          courseId: selectedCourseId,
          videoUrl: uploadedVideoUrl,
          pdfUrl: uploadedPdfUrl || null,
          thumbnail: uploadedThumbUrl || null,
          isFree: formFree.checked,
          price: formFree.checked ? 0 : parseFloat(document.getElementById('formPrice').value) || 0,
          status: 'published',
          createdAt: Timestamp.now(),
          updatedAt: Timestamp.now()
        };

        if (document.getElementById('formSchedule').value) {
          lessonData.scheduledPublish = Timestamp.fromDate(new Date(document.getElementById('formSchedule').value));
        }

        await addDoc(collection(db, 'lessons'), lessonData);
        showToast('✅ Lesson uploaded successfully!', 'success');

        // Redirect to lessons after short delay
        setTimeout(() => {
          window.location.href = backToLessonsBtn.href;
        }, 1500);

      } catch (error) {
        showToast('Upload failed: ' + error.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload Lesson';
      }
    });

    resetBtn.addEventListener('click', () => {
      if (confirm('Reset all fields?')) {
        form.reset();
        uploadedVideoUrl = null;
        uploadedPdfUrl = null;
        uploadedThumbUrl = null;
        videoPreview.style.display = 'none';
        pdfPreview.style.display = 'none';
        thumbPreview.style.display = 'none';
        priceContainer.style.display = 'none';
        formFree.checked = true;
        showToast('Form reset', 'success');
      }
    });

    // ========== LANGUAGE & DARK MODE ==========
    let lang = 'en';
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const langLabel = document.getElementById('langLabel');
    const mainEl = document.getElementById('mainContent');

    langToggle.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      langLabel.textContent = lang.toUpperCase();
      if (lang === 'ar') {
        document.querySelector('.navbar h1').textContent = '📤 رفع درس';
        document.getElementById('backToLessonsBtn').innerHTML = '<i class="fas fa-arrow-left"></i> العودة للدروس';
        document.querySelector('label[for="formTitle"]').innerHTML = 'عنوان الدرس <span class="required">*</span>';
        document.querySelector('label[for="formDesc"]').textContent = 'الوصف';
        document.querySelector('label[for="formCourse"]').innerHTML = 'اختر الدورة <span class="required">*</span>';
        document.querySelector('label[for="formVideo"]').innerHTML = 'الفيديو <span class="required">*</span>';
        document.querySelector('label[for="formPdf"]').textContent = 'PDF (اختياري)';
        document.querySelector('label[for="formThumbnail"]').textContent = 'الصورة المصغرة (اختياري)';
        document.querySelector('label[for="formSchedule"]').textContent = 'جدولة النشر';
        document.getElementById('formFree').nextElementSibling.textContent = 'درس مجاني';
        document.getElementById('formPrice').placeholder = 'السعر ($)';
        document.getElementById('resetBtn').textContent = 'إعادة تعيين';
        document.getElementById('submitBtn').innerHTML = '<i class="fas fa-cloud-upload-alt"></i> رفع الدرس';
        document.querySelector('#videoUploadBtn .file-info').textContent = 'انقر لرفع الفيديو (MP4, MOV)';
        document.querySelector('#pdfUploadBtn .file-info').textContent = 'انقر لرفع PDF';
        document.querySelector('#thumbUploadBtn .file-info').textContent = 'انقر لرفع الصورة (JPG, PNG)';
        mainEl.classList.add('rtl');
      } else {
        document.querySelector('.navbar h1').textContent = '📤 Upload Lesson';
        document.getElementById('backToLessonsBtn').innerHTML = '<i class="fas fa-arrow-left"></i> Back to Lessons';
        document.querySelector('label[for="formTitle"]').innerHTML = 'Lesson Title <span class="required">*</span>';
        document.querySelector('label[for="formDesc"]').textContent = 'Description';
        document.querySelector('label[for="formCourse"]').innerHTML = 'Select Course <span class="required">*</span>';
        document.querySelector('label[for="formVideo"]').innerHTML = 'Video <span class="required">*</span>';
        document.querySelector('label[for="formPdf"]').textContent = 'PDF (Optional)';
        document.querySelector('label[for="formThumbnail"]').textContent = 'Thumbnail (Optional)';
        document.querySelector('label[for="formSchedule"]').textContent = 'Schedule Publish';
        document.getElementById('formFree').nextElementSibling.textContent = 'Free Lesson';
        document.getElementById('formPrice').placeholder = 'Price ($)';
        document.getElementById('resetBtn').textContent = 'Reset';
        document.getElementById('submitBtn').innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload Lesson';
        document.querySelector('#videoUploadBtn .file-info').textContent = 'Click to upload video (MP4, MOV)';
        document.querySelector('#pdfUploadBtn .file-info').textContent = 'Click to upload PDF';
        document.querySelector('#thumbUploadBtn .file-info').textContent = 'Click to upload thumbnail (JPG, PNG)';
        mainEl.classList.remove('rtl');
      }
    });

    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      darkToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    console.log('✅ Lesson Upload ready.');
  </script>
