<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · Course Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Cloudinary Widget (just in case) -->
  <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;
      color: #0b1e33;
      display: flex;
      min-height: 100vh;
    }
    body.dark-mode { background: #0b0e14; color: #eef2f6; }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #ffffff;
      border-right: 1px solid #e7edf5;
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 1000;
      transition: transform 0.3s ease;
      transform: translateX(0);
    }
    body.dark-mode .sidebar { background: #141a26; border-right-color: #2a3442; }
    .sidebar.closed { transform: translateX(-100%); }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.5rem;
    }
    .sidebar-logo i {
      font-size: 1.8rem;
      color: #2a7de1;
      background: #e8f0fe;
      padding: 0.6rem;
      border-radius: 14px;
    }
    body.dark-mode .sidebar-logo i { background: #1f2a40; color: #6b9ef0; }
    .sidebar-logo span { font-weight: 700; font-size: 1.5rem; letter-spacing: -0.5px; }
    .sidebar-logo span small { color: #2a7de1; }
    .sidebar nav { flex: 1; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      color: #4a5b7a;
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
      margin-bottom: 0.3rem;
    }
    body.dark-mode .sidebar nav a { color: #b0c0d4; }
    .sidebar nav a i { width: 1.4rem; }
    .sidebar nav a:hover, .sidebar nav a.active {
      background: #eef4fe;
      color: #1a67c4;
    }
    body.dark-mode .sidebar nav a:hover, body.dark-mode .sidebar nav a.active {
      background: #1f2a40;
      color: #6b9ef0;
    }
    .sidebar-footer {
      border-top: 1px solid #e7edf5;
      padding-top: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #6b7d9c;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    body.dark-mode .sidebar-footer { border-top-color: #2a3442; }
    .sidebar-footer:hover { color: #e74c3c; }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 999;
    }
    .sidebar-overlay.show { display: block; }

    /* Main */
    .main {
      flex: 1;
      margin-left: 260px;
      padding: 1.8rem 2rem 2.5rem;
      transition: margin-left 0.3s ease;
      overflow-x: hidden;
      width: 100%;
    }
    .main.expanded { margin-left: 0; }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .navbar h1 { font-size: 1.7rem; font-weight: 700; }
    .navbar-actions { display: flex; align-items: center; gap: 1.2rem; }
    .navbar-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #4a5b7a;
      cursor: pointer;
    }
    body.dark-mode .navbar-actions button { color: #b0c0d4; }
    .navbar-actions button:hover { color: #2a7de1; }
    .lang-dark { display: flex; gap: 0.6rem; }
    .lang-dark button {
      background: none;
      border: none;
      font-weight: 600;
      color: #2a7de1;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lang-dark .dark-toggle { color: #6b7d9c; }
    body.dark-mode .lang-dark .dark-toggle { color: #b0c0d4; }
    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #4a5b7a;
      cursor: pointer;
    }
    body.dark-mode .hamburger { color: #b0c0d4; }

    .course-header {
      background: #ffffff;
      border-radius: 24px;
      padding: 1.8rem 2rem;
      margin-bottom: 2rem;
      border: 1px solid #eef2f8;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      align-items: center;
    }
    body.dark-mode .course-header { background: #1a1f2b; border-color: #2a3442; }
    .course-header .thumb {
      width: 160px;
      height: 120px;
      border-radius: 16px;
      background: #dfe6f0;
      object-fit: cover;
      flex-shrink: 0;
    }
    body.dark-mode .course-header .thumb { background: #2a3442; }
    .course-header .info { flex: 1; }
    .course-header .info h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.3rem; }
    .course-header .info .desc { color: #6b7d9c; margin-bottom: 0.8rem; }
    body.dark-mode .course-header .info .desc { color: #9aabbf; }
    .course-header .info .meta { display: flex; gap: 1.5rem; flex-wrap: wrap; font-size: 0.9rem; }
    .course-header .info .meta span { display: flex; align-items: center; gap: 0.4rem; }
    .course-header .info .meta i { color: #2a7de1; width: 1.2rem; }
    .badge-status {
      padding: 0.25rem 1rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #e8f0fe;
      color: #1a67c4;
    }
    .badge-status.archived { background: #fef3e2; color: #b9770e; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 1.2rem;
      border: 1px solid #eef2f8;
      text-align: center;
    }
    body.dark-mode .stat-card { background: #1a1f2b; border-color: #2a3442; }
    .stat-card .label {
      font-size: 0.8rem;
      color: #6b7d9c;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .stat-card .value { font-size: 2rem; font-weight: 700; margin: 0.3rem 0; }
    .stat-card i { color: #2a7de1; opacity: 0.6; font-size: 1.2rem; }

    .card-panel {
      background: #ffffff;
      border-radius: 20px;
      padding: 1.5rem;
      border: 1px solid #eef2f8;
      margin-bottom: 1.5rem;
    }
    body.dark-mode .card-panel { background: #1a1f2b; border-color: #2a3442; }
    .card-panel h3 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .card-panel h3 i { color: #2a7de1; }

    .student-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid #f0f4fa;
    }
    body.dark-mode .student-item { border-bottom-color: #2a3442; }
    .student-item .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e8f0fe;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2a7de1;
      font-weight: 700;
    }
    .student-item .name { font-weight: 500; }
    .student-item .email { font-size: 0.85rem; color: #6b7d9c; margin-left: auto; }

    .empty-state { text-align: center; padding: 2rem; color: #8a9bb5; }
    .empty-state i { font-size: 2.5rem; margin-bottom: 0.5rem; opacity: 0.5; }

    .btn-primary {
      background: #2a7de1;
      color: white;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }
    .btn-primary:hover { background: #1a67c4; }
    .btn-secondary {
      background: #eef2f8;
      color: #1a253a;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }
    body.dark-mode .btn-secondary { background: #2a3442; color: #eef2f6; }
    .btn-secondary:hover { background: #dfe6f0; }

    .action-bar { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .toast {
      padding: 0.8rem 1.5rem;
      border-radius: 14px;
      background: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: slideIn 0.3s ease;
    }
    body.dark-mode .toast { background: #2a3442; color: #eef2f6; }
    .toast.success { border-left: 4px solid #10B981; }
    .toast.error { border-left: 4px solid #EF4444; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    @media (max-width: 768px) {
      .hamburger { display: block; }
      .main { margin-left: 0; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.closed { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .course-header { flex-direction: column; align-items: flex-start; }
      .course-header .thumb { width: 100%; height: 160px; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .action-bar { flex-direction: column; }
    }
    .rtl { direction: rtl; }
    .rtl .sidebar nav a { flex-direction: row-reverse; }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>Edu<small>Core</small></span>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
      <a href="courses.html" class="active"><i class="fas fa-book-open"></i> Courses</a>
      <a href="students.html"><i class="fas fa-users"></i> Students</a>
      <a href="live-classes.html"><i class="fas fa-video"></i> Live Classes</a>
      <a href="revenue.html"><i class="fas fa-dollar-sign"></i> Revenue</a>
      <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="sidebar-footer" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> Logout
    </div>
  </aside>

  <div class="main" id="mainContent">
    <header class="navbar">
      <div style="display:flex; align-items:center; gap:1rem;">
        <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
        <h1 id="pageTitle">📘 Course Details</h1>
      </div>
      <div class="navbar-actions">
        <div class="lang-dark">
          <button id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
          <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>
        <button><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
      </div>
    </header>

    <div id="courseHeader" class="course-header">
      <div class="empty-state" style="width:100%;"><i class="fas fa-spinner fa-spin"></i><br>Loading course...</div>
    </div>

    <div class="action-bar">
      <a href="#" id="viewLessonsBtn" class="btn-primary"><i class="fas fa-file-alt"></i> View Lessons</a>
      <a href="#" id="uploadLessonBtn" class="btn-secondary"><i class="fas fa-upload"></i> Upload Lesson</a>
      <a href="courses.html" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back to Courses</a>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="label">Students</div><div class="value" id="statStudents">—</div><i class="fas fa-user-graduate"></i></div>
      <div class="stat-card"><div class="label">Lessons</div><div class="value" id="statLessons">—</div><i class="fas fa-file-alt"></i></div>
      <div class="stat-card"><div class="label">Revenue</div><div class="value" id="statRevenue">—</div><i class="fas fa-dollar-sign"></i></div>
      <div class="stat-card"><div class="label">Completion</div><div class="value" id="statCompletion">—</div><i class="fas fa-chart-line"></i></div>
    </div>

    <div class="card-panel">
      <h3><i class="fas fa-users"></i> Enrolled Students</h3>
      <div id="studentsList"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><br>Loading students...</div></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module">
    // ========== FIREBASE ==========
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOBJ22snwOow8xfQnL2WmCusmyS8iWWlk",
      authDomain: "educore-c3b42.firebaseapp.com",
      projectId: "educore-c3b42",
      storageBucket: "educore-c3b42.firebasestorage.app",
      messagingSenderId: "750509780814",
      appId: "1:750509780814:web:f57bddff39c7668b3cf81f",
      measurementId: "G-LF317C03Q0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ========== AUTH ==========
    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = 'login.html';
      else {
        document.body.classList.add('auth-ready');
        initPage();
      }
    });

    // ========== MOBILE SIDEBAR ==========
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    document.getElementById('hamburgerBtn').addEventListener('click', () => {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });
    document.querySelectorAll('.sidebar nav a').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
          sidebar.classList.remove('open');
          overlay.classList.remove('show');
        }
      });
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('Are you sure you want to logout?')) {
        signOut(auth).then(() => window.location.href = 'login.html');
      }
    });

    // ========== TOAST ==========
    function showToast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ========== COURSE DETAILS ==========
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('id');

    const header = document.getElementById('courseHeader');
    const statStudentsEl = document.getElementById('statStudents');
    const statLessonsEl = document.getElementById('statLessons');
    const statRevenueEl = document.getElementById('statRevenue');
    const statCompletionEl = document.getElementById('statCompletion');
    const studentsList = document.getElementById('studentsList');
    const pageTitle = document.getElementById('pageTitle');
    const viewLessonsBtn = document.getElementById('viewLessonsBtn');
    const uploadLessonBtn = document.getElementById('uploadLessonBtn');

    function initPage() {
      if (courseId) {
        loadCourseDetails(courseId);
      } else {
        header.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>No course ID provided</div>';
      }
    }

    async function loadCourseDetails(id) {
      try {
        // Get course document
        const docRef = doc(db, 'courses', id);
        const docSnap = await getDoc(docRef);
        if (!docSnap.exists()) {
          header.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>Course not found</div>';
          return;
        }
        const course = { id: docSnap.id, ...docSnap.data() };
        pageTitle.textContent = `📘 ${course.title || 'Course Details'}`;

        // Set navigation links
        viewLessonsBtn.href = `lessons.html?courseId=${id}`;
        uploadLessonBtn.href = `lesson-upload.html?courseId=${id}`;

        // Render header
        renderHeader(course);

        // Fetch enrollments, lessons, progress in parallel
        const [enrollSnap, lessonsSnap] = await Promise.all([
          getDocs(query(collection(db, 'enrollments'), where('courseId', '==', id))),
          getDocs(query(collection(db, 'lessons'), where('courseId', '==', id)))
        ]);

        const studentIds = enrollSnap.docs.map(d => d.data().studentId);
        const studentCount = studentIds.length;
        const lessonCount = lessonsSnap.size;

        // Revenue
        let totalRevenue = 0;
        enrollSnap.forEach(doc => {
          const data = doc.data();
          if (data.price) totalRevenue += Number(data.price);
        });

        // Completion rate
        let completionRate = 0;
        const progressQuery = query(collection(db, 'progress'), where('courseId', '==', id));
        const progressSnap = await getDocs(progressQuery);
        if (progressSnap.size > 0) {
          let totalProgress = 0;
          progressSnap.forEach(doc => {
            const data = doc.data();
            totalProgress += data.progress || 0;
          });
          completionRate = Math.round(totalProgress / progressSnap.size);
        }

        statStudentsEl.textContent = studentCount;
        statLessonsEl.textContent = lessonCount;
        statRevenueEl.textContent = '$' + totalRevenue.toFixed(0);
        statCompletionEl.textContent = completionRate + '%';

        // Load enrolled students details
        if (studentIds.length === 0) {
          studentsList.innerHTML = '<div class="empty-state"><i class="fas fa-user-graduate"></i><br>No students enrolled yet</div>';
        } else {
          let html = '';
          for (const sid of studentIds) {
            try {
              const userRef = doc(db, 'students', sid); // assuming student documents
              const userSnap = await getDoc(userRef);
              if (userSnap.exists()) {
                const user = userSnap.data();
                const name = user.displayName || user.name || 'Student';
                const email = user.email || '';
                const initial = (name.charAt(0) || '?').toUpperCase();
                html += `
                  <div class="student-item">
                    <div class="avatar">${initial}</div>
                    <div class="name">${name}</div>
                    <div class="email">${email}</div>
                  </div>`;
              }
            } catch (e) { /* skip missing student */ }
          }
          studentsList.innerHTML = html || '<div class="empty-state">No student details available</div>';
        }

      } catch (error) {
        console.error(error);
        showToast('Failed to load course details', 'error');
        header.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><br>Error loading course</div>';
      }
    }

    function renderHeader(course) {
      const statusClass = course.status === 'archived' ? 'archived' : '';
      const statusLabel = course.status || 'active';
      header.innerHTML = `
        ${course.thumbnail ? `<img class="thumb" src="${course.thumbnail}" alt="${course.title}">` : `<div class="thumb" style="display:flex;align-items:center;justify-content:center;background:#eef2f8;color:#8a9bb5;"><i class="fas fa-image" style="font-size:2.5rem;"></i></div>`}
        <div class="info">
          <h2>${course.title || 'Untitled Course'}</h2>
          <div class="desc">${course.description || 'No description provided.'}</div>
          <div class="meta">
            <span><i class="fas fa-tag"></i> $${course.price || '0'}</span>
            <span><i class="fas fa-calendar-alt"></i> ${course.createdAt ? new Date(course.createdAt.seconds * 1000).toLocaleDateString() : 'N/A'}</span>
            <span class="badge-status ${statusClass}">${statusLabel}</span>
          </div>
        </div>
      `;
    }

    // ========== LANGUAGE & DARK MODE ==========
    let lang = 'en';
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const langLabel = document.getElementById('langLabel');
    const mainEl = document.getElementById('mainContent');

    function applyLanguage(langCode) {
      if (langCode === 'ar') {
        document.querySelector('.navbar h1').textContent = '📘 تفاصيل الدورة';
        document.querySelector('.stats-grid .stat-card:nth-child(1) .label').textContent = 'الطلاب';
        document.querySelector('.stats-grid .stat-card:nth-child(2) .label').textContent = 'الدروس';
        document.querySelector('.stats-grid .stat-card:nth-child(3) .label').textContent = 'الإيرادات';
        document.querySelector('.stats-grid .stat-card:nth-child(4) .label').textContent = 'الإنجاز';
        document.querySelector('.card-panel h3').innerHTML = '<i class="fas fa-users"></i> الطلاب المسجلين';
        viewLessonsBtn.innerHTML = '<i class="fas fa-file-alt"></i> عرض الدروس';
        uploadLessonBtn.innerHTML = '<i class="fas fa-upload"></i> رفع درس';
        document.querySelector('.action-bar a.btn-secondary').innerHTML = '<i class="fas fa-arrow-left"></i> العودة للدورات';
        mainEl.classList.add('rtl');
      } else {
        document.querySelector('.navbar h1').textContent = '📘 Course Details';
        document.querySelector('.stats-grid .stat-card:nth-child(1) .label').textContent = 'Students';
        document.querySelector('.stats-grid .stat-card:nth-child(2) .label').textContent = 'Lessons';
        document.querySelector('.stats-grid .stat-card:nth-child(3) .label').textContent = 'Revenue';
        document.querySelector('.stats-grid .stat-card:nth-child(4) .label').textContent = 'Completion';
        document.querySelector('.card-panel h3').innerHTML = '<i class="fas fa-users"></i> Enrolled Students';
        viewLessonsBtn.innerHTML = '<i class="fas fa-file-alt"></i> View Lessons';
        uploadLessonBtn.innerHTML = '<i class="fas fa-upload"></i> Upload Lesson';
        document.querySelector('.action-bar a.btn-secondary').innerHTML = '<i class="fas fa-arrow-left"></i> Back to Courses';
        mainEl.classList.remove('rtl');
      }
    }

    langToggle.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      langLabel.textContent = lang.toUpperCase();
      applyLanguage(lang);
    });

    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      darkToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    console.log('✅ Course Details ready.');
  </script>
</body>
</html>
