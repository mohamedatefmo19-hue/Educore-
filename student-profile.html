<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · Student Profile</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Shared styles -->
  <link rel="stylesheet" href="shared.css">

  <style>
    body {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, border 0.2s;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 10;
    }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.5rem;
    }
    .sidebar-logo i {
      font-size: 1.8rem;
      color: var(--primary);
      background: rgba(42,125,225,0.1);
      padding: 0.6rem;
      border-radius: 14px;
    }
    .sidebar-logo span {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .sidebar-logo span small { color: var(--primary); }
    .sidebar nav { flex: 1; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
      margin-bottom: 0.3rem;
    }
    .sidebar nav a i { width: 1.4rem; }
    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: rgba(42,125,225,0.1);
      color: var(--primary);
    }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: 0.15s;
    }
    .sidebar-footer:hover { color: #e74c3c; }

    /* Main */
    .main {
      flex: 1;
      padding: 1.8rem 2rem 2.5rem;
      overflow-x: hidden;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .navbar h1 { font-size: 1.7rem; font-weight: 700; }
    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .navbar-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.15s;
    }
    .navbar-actions button:hover { color: var(--primary); }
    .lang-dark { display: flex; gap: 0.6rem; }
    .lang-dark button {
      background: none;
      border: none;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lang-dark .dark-toggle { color: var(--text-secondary); }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }
    .back-link:hover { color: var(--primary); }

    /* Profile Header Card */
    .profile-header {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 2rem;
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      display: flex;
      gap: 2rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(42,125,225,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--primary);
      flex-shrink: 0;
      overflow: hidden;
    }
    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-info {
      flex: 1;
    }
    .profile-info h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }
    .profile-info p {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .profile-info .meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 0.8rem;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-success { background: #e3f5e9; color: #1f7840; }
    .badge-danger { background: #fde8e8; color: #b3403a; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.9rem;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: var(--bg);
      color: var(--text);
    }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger {
      background: #e74c3c;
      color: white;
    }
    .btn-danger:hover { background: #c0392b; }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .card h3 i { color: var(--primary); }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }
    .info-item:last-child { border-bottom: none; }
    .info-label { color: var(--text-secondary); font-weight: 500; }
    .info-value { font-weight: 600; }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th {
      text-align: left;
      padding: 0.7rem 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 2px solid var(--border);
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    td {
      padding: 0.7rem 0.8rem;
      border-bottom: 1px solid var(--border);
    }
    tr:last-child td { border-bottom: none; }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 10px;
    }

    .timeline {
      position: relative;
      padding-left: 28px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }
    .timeline-item {
      position: relative;
      margin-bottom: 1.2rem;
      padding-left: 12px;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -22px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid var(--card-bg);
      box-shadow: 0 0 0 2px var(--primary);
    }
    .timeline-date {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .timeline-action {
      font-weight: 600;
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
    }

    .rtl { direction: rtl; }
    .rtl .sidebar nav a { flex-direction: row-reverse; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 1.2rem; }
      .info-grid { grid-template-columns: 1fr; }
      .profile-header { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>Edu<small>Core</small></span>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-chart-pie"></i> <span data-key="dashboard">Dashboard</span></a>
      <a href="courses.html"><i class="fas fa-book-open"></i> <span data-key="courses">Courses</span></a>
      <a href="lessons.html"><i class="fas fa-file-alt"></i> <span data-key="lessons">Lessons</span></a>
      <a href="live-classes.html"><i class="fas fa-video"></i> <span data-key="live">Live Classes</span></a>
      <a href="students.html" class="active"><i class="fas fa-users"></i> <span data-key="students">Students</span></a>
      <a href="revenue.html"><i class="fas fa-dollar-sign"></i> <span data-key="revenue">Revenue</span></a>
      <a href="settings.html"><i class="fas fa-cog"></i> <span data-key="settings">Settings</span></a>
    </nav>
    <div class="sidebar-footer" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> <span data-key="logout">Logout</span>
    </div>
  </aside>

  <!-- Main -->
  <div class="main" id="mainContent">
    <header class="navbar">
      <h1 id="pageTitle">👤 Student Profile</h1>
      <div class="navbar-actions">
        <div class="lang-dark">
          <button id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
          <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>
        <button><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
      </div>
    </header>

    <a href="students.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Students</a>

    <div id="profileContainer">
      <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><br>Loading profile...</div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase.js';
    import { showToast, showLoading, hideLoading } from './shared.js';
    import { initOneSignal } from './onesignal.js';
    import {
      onAuthStateChanged,
      signOut
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';
    import {
      doc,
      getDoc,
      collection,
      getDocs,
      updateDoc,
      query,
      orderBy
    } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

    // Auth protection
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        document.body.classList.add('auth-ready');
        initPage();
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');
    let studentData = null;

    function initPage() {
      if (!studentId) {
        document.getElementById('profileContainer').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <p>No student ID provided. Please go back and select a student.</p>
            <a href="students.html" class="btn btn-secondary" style="margin-top:1rem;">Back to Students</a>
          </div>`;
        return;
      }
      loadStudentProfile(studentId);
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      if (confirm('Are you sure you want to logout?')) {
        try {
          await signOut(auth);
          window.location.href = 'login.html';
        } catch (error) {
          showToast('Logout failed.', 'error');
        }
      }
    });

    async function loadStudentProfile(id) {
      showLoading();
      try {
        const docRef = doc(db, 'students', id);
        const docSnap = await getDoc(docRef);
        if (!docSnap.exists()) {
          throw new Error('Student not found.');
        }
        studentData = { id: docSnap.id, ...docSnap.data() };

        // Fetch subcollections
        const [coursesSnap, examsSnap, attendanceSnap, activitySnap] = await Promise.all([
          getDocs(collection(db, 'students', id, 'courses')),
          getDocs(collection(db, 'students', id, 'examResults')),
          getDocs(query(collection(db, 'students', id, 'attendance'), orderBy('date', 'desc'))),
          getDocs(query(collection(db, 'students', id, 'activityHistory'), orderBy('timestamp', 'desc')))
        ]);

        renderProfile(studentData, coursesSnap, examsSnap, attendanceSnap, activitySnap);
      } catch (error) {
        console.error(error);
        document.getElementById('profileContainer').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle" style="color:#e74c3c;"></i>
            <p>${escapeHtml(error.message)}</p>
            <a href="students.html" class="btn btn-secondary" style="margin-top:1rem;">Back to Students</a>
          </div>`;
        showToast('Failed to load profile.', 'error');
      } finally {
        hideLoading();
      }
    }

    function renderProfile(student, coursesSnap, examsSnap, attendanceSnap, activitySnap) {
      const container = document.getElementById('profileContainer');
      const isBlocked = student.status === 'blocked';
      const enrollmentDate = student.enrollmentDate
        ? new Date(student.enrollmentDate.seconds ? student.enrollmentDate.seconds * 1000 : student.enrollmentDate).toLocaleDateString()
        : '—';
      const avatarContent = student.avatar
        ? `<img src="${student.avatar}" alt="${student.name}">`
        : (student.name ? student.name.charAt(0).toUpperCase() : '?');

      let html = `
        <!-- Profile Header -->
        <div class="profile-header">
          <div class="profile-avatar">${avatarContent}</div>
          <div class="profile-info">
            <h2>${escapeHtml(student.name || 'Unknown')}</h2>
            <p>${escapeHtml(student.email || '')}</p>
            <div class="meta">
              <span class="badge ${isBlocked ? 'badge-danger' : 'badge-success'}">${isBlocked ? 'Blocked' : 'Active'}</span>
              <span style="color: var(--text-secondary); font-size:0.9rem;"><i class="fas fa-calendar-alt"></i> ${enrollmentDate}</span>
            </div>
          </div>
          <div style="display:flex; gap:0.8rem;">
            <button class="btn ${isBlocked ? 'btn-primary' : 'btn-danger'}" id="toggleBlockBtn">
              <i class="fas ${isBlocked ? 'fa-unlock' : 'fa-lock'}"></i> ${isBlocked ? 'Unblock' : 'Block'}
            </button>
          </div>
        </div>

        <!-- Information Card -->
        <div class="card">
          <h3><i class="fas fa-info-circle"></i> Student Information</h3>
          <div class="info-grid">
            <div class="info-item"><span class="info-label">Name</span><span class="info-value">${escapeHtml(student.name || '—')}</span></div>
            <div class="info-item"><span class="info-label">Email</span><span class="info-value">${escapeHtml(student.email || '—')}</span></div>
            <div class="info-item"><span class="info-label">Phone</span><span class="info-value">${escapeHtml(student.phone || '—')}</span></div>
            <div class="info-item"><span class="info-label">Enrollment</span><span class="info-value">${enrollmentDate}</span></div>
          </div>
        </div>

        <!-- Courses -->
        <div class="card">
          <h3><i class="fas fa-book-open"></i> Enrolled Courses</h3>
          ${renderCoursesTable(coursesSnap)}
        </div>

        <!-- Exam Results -->
        <div class="card">
          <h3><i class="fas fa-file-alt"></i> Exam Results</h3>
          ${renderExamsTable(examsSnap)}
        </div>

        <!-- Attendance -->
        <div class="card">
          <h3><i class="fas fa-check-circle"></i> Attendance</h3>
          ${renderAttendanceTable(attendanceSnap)}
        </div>

        <!-- Activity History -->
        <div class="card">
          <h3><i class="fas fa-clock"></i> Activity History</h3>
          ${renderActivityTimeline(activitySnap)}
        </div>
      `;

      container.innerHTML = html;

      // Toggle block/unblock
      document.getElementById('toggleBlockBtn').addEventListener('click', async () => {
        const newStatus = isBlocked ? 'active' : 'blocked';
        try {
          await updateDoc(doc(db, 'students', student.id), { status: newStatus });
          showToast(`Student ${newStatus === 'blocked' ? 'blocked' : 'unblocked'}.`, 'success');
          loadStudentProfile(student.id); // Refresh
        } catch (error) {
          showToast('Error updating status.', 'error');
        }
      });
    }

    function renderCoursesTable(snap) {
      if (snap.empty) return '<div class="empty-state">No courses enrolled.</div>';
      let rows = '';
      snap.forEach(doc => {
        const course = doc.data();
        rows += `
          <tr>
            <td><strong>${escapeHtml(course.courseName || 'Unnamed')}</strong></td>
            <td>${escapeHtml(course.instructor || '—')}</td>
            <td>
              <div style="display:flex;align-items:center;gap:0.5rem;">
                <div class="progress-bar" style="flex:1;"><div class="progress-fill" style="width:${course.progress || 0}%;"></div></div>
                <span style="font-size:0.85rem;">${course.progress || 0}%</span>
              </div>
            </td>
          </tr>`;
      });
      return `<div class="table-responsive"><table><thead><tr><th>Course</th><th>Instructor</th><th>Progress</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function renderExamsTable(snap) {
      if (snap.empty) return '<div class="empty-state">No exam results.</div>';
      let rows = '';
      snap.forEach(doc => {
        const exam = doc.data();
        const examDate = exam.date
          ? new Date(exam.date.seconds ? exam.date.seconds * 1000 : exam.date).toLocaleDateString()
          : '—';
        rows += `
          <tr>
            <td><strong>${escapeHtml(exam.examName || 'Unnamed')}</strong></td>
            <td>${exam.score ?? '—'} / ${exam.total ?? '—'}</td>
            <td>${examDate}</td>
          </tr>`;
      });
      return `<div class="table-responsive"><table><thead><tr><th>Exam</th><th>Score</th><th>Date</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function renderAttendanceTable(snap) {
      if (snap.empty) return '<div class="empty-state">No attendance records.</div>';
      let rows = '';
      snap.forEach(doc => {
        const att = doc.data();
        const attDate = att.date
          ? new Date(att.date.seconds ? att.date.seconds * 1000 : att.date).toLocaleDateString()
          : '—';
        const statusBadge = att.status === 'present'
          ? '<span class="badge badge-success">Present</span>'
          : '<span class="badge badge-danger">Absent</span>';
        rows += `
          <tr>
            <td>${attDate}</td>
            <td>${escapeHtml(att.className || '—')}</td>
            <td>${statusBadge}</td>
          </tr>`;
      });
      return `<div class="table-responsive"><table><thead><tr><th>Date</th><th>Class</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function renderActivityTimeline(snap) {
      if (snap.empty) return '<div class="empty-state">No activity recorded.</div>';
      let html = '<div class="timeline">';
      snap.forEach(doc => {
        const act = doc.data();
        const actTime = act.timestamp
          ? new Date(act.timestamp.seconds ? act.timestamp.seconds * 1000 : act.timestamp)
          : null;
        const timeStr = actTime ? actTime.toLocaleString() : '';
        html += `
          <div class="timeline-item">
            <div class="timeline-date">${timeStr}</div>
            <div class="timeline-action">${escapeHtml(act.action || '')}</div>
            ${act.details ? `<div style="color: var(--text-secondary); font-size:0.8rem;">${escapeHtml(act.details)}</div>` : ''}
          </div>`;
      });
      html += '</div>';
      return html;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        if (m === "'") return '&#039;';
        return m;
      });
    }

    // Language & Dark Mode
    let lang = 'en';
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const langLabel = document.getElementById('langLabel');
    const main = document.getElementById('mainContent');

    const translations = {
      en: {
        dashboard: 'Dashboard',
        courses: 'Courses',
        lessons: 'Lessons',
        live: 'Live Classes',
        students: 'Students',
        revenue: 'Revenue',
        settings: 'Settings',
        logout: 'Logout',
        pageTitle: '👤 Student Profile',
        backLink: '<i class="fas fa-arrow-left"></i> Back to Students'
      },
      ar: {
        dashboard: 'لوحة التحكم',
        courses: 'الدورات',
        lessons: 'الدروس',
        live: 'الحصص المباشرة',
        students: 'الطلاب',
        revenue: 'الإيرادات',
        settings: 'الإعدادات',
        logout: 'تسجيل الخروج',
        pageTitle: '👤 ملف الطالب',
        backLink: '<i class="fas fa-arrow-right"></i> العودة للطلاب'
      }
    };

    function applyLanguage(langCode) {
      const t = translations[langCode];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (t[key]) el.textContent = t[key];
      });
      document.getElementById('pageTitle').textContent = t.pageTitle;
      const backLink = document.querySelector('.back-link');
      if (backLink) backLink.innerHTML = t.backLink;
      main.classList.toggle('rtl', langCode === 'ar');
    }

    langToggle.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      langLabel.textContent = lang.toUpperCase();
      applyLanguage(lang);
    });

    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      darkToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    // Init OneSignal
    initOneSignal();
    console.log('✅ Student Profile ready (production mode)');
  </script>
</body>
</html>
