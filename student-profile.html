<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>EduCore · Student Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fc;
      color: #0b1e33;
      display: flex;
      min-height: 100vh;
    }
    body.dark-mode { background: #0b0e14; color: #eef2f6; }

    .sidebar {
      width: 260px;
      background: #ffffff;
      border-right: 1px solid #e7edf5;
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 1000;
      transition: transform 0.3s ease;
      transform: translateX(0);
    }
    body.dark-mode .sidebar { background: #141a26; border-right-color: #2a3442; }
    .sidebar.closed { transform: translateX(-100%); }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 2.5rem;
    }
    .sidebar-logo i {
      font-size: 1.8rem;
      color: #2a7de1;
      background: #e8f0fe;
      padding: 0.6rem;
      border-radius: 14px;
    }
    body.dark-mode .sidebar-logo i { background: #1f2a40; color: #6b9ef0; }
    .sidebar-logo span { font-weight: 700; font-size: 1.5rem; letter-spacing: -0.5px; }
    .sidebar-logo span small { color: #2a7de1; }
    .sidebar nav { flex: 1; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      color: #4a5b7a;
      text-decoration: none;
      font-weight: 500;
      transition: 0.15s;
      margin-bottom: 0.3rem;
    }
    body.dark-mode .sidebar nav a { color: #b0c0d4; }
    .sidebar nav a i { width: 1.4rem; }
    .sidebar nav a:hover, .sidebar nav a.active {
      background: #eef4fe;
      color: #1a67c4;
    }
    body.dark-mode .sidebar nav a:hover, body.dark-mode .sidebar nav a.active {
      background: #1f2a40;
      color: #6b9ef0;
    }
    .sidebar-footer {
      border-top: 1px solid #e7edf5;
      padding-top: 1.2rem;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #6b7d9c;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    body.dark-mode .sidebar-footer { border-top-color: #2a3442; }
    .sidebar-footer:hover { color: #e74c3c; }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 999;
    }
    .sidebar-overlay.show { display: block; }

    .main {
      flex: 1;
      margin-left: 260px;
      padding: 1.8rem 2rem 2.5rem;
      transition: margin-left 0.3s ease;
      overflow-x: hidden;
      width: 100%;
    }
    .main.expanded { margin-left: 0; }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .navbar h1 { font-size: 1.7rem; font-weight: 700; }
    .navbar-actions { display: flex; align-items: center; gap: 1.2rem; }
    .navbar-actions button {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #4a5b7a;
      cursor: pointer;
    }
    body.dark-mode .navbar-actions button { color: #b0c0d4; }
    .navbar-actions button:hover { color: #2a7de1; }
    .lang-dark { display: flex; gap: 0.6rem; }
    .lang-dark button {
      background: none;
      border: none;
      font-weight: 600;
      color: #2a7de1;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .lang-dark .dark-toggle { color: #6b7d9c; }
    body.dark-mode .lang-dark .dark-toggle { color: #b0c0d4; }
    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #4a5b7a;
      cursor: pointer;
    }
    body.dark-mode .hamburger { color: #b0c0d4; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #4a5b7a;
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }
    .back-link:hover { color: #2a7de1; }

    .profile-header {
      background: #ffffff;
      border-radius: 24px;
      padding: 2rem;
      border: 1px solid #eef2f8;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 2rem;
      align-items: center;
      flex-wrap: wrap;
    }
    body.dark-mode .profile-header { background: #1a1f2b; border-color: #2a3442; }
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #e8f0fe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #2a7de1;
      flex-shrink: 0;
      overflow: hidden;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-info { flex: 1; }
    .profile-info h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.3rem; }
    .profile-info p { color: #6b7d9c; font-size: 0.9rem; }
    .profile-info .meta { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.8rem; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-success { background: #e3f5e9; color: #1f7840; }
    .badge-danger { background: #fde8e8; color: #b3403a; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 40px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.9rem;
      text-decoration: none;
    }
    .btn-primary { background: #2a7de1; color: white; }
    .btn-primary:hover { background: #1a67c4; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    .btn-secondary { background: #eef2f8; color: #1a253a; }
    .btn-secondary:hover { background: #dfe6f0; }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 1.5rem;
      border: 1px solid #eef2f8;
      margin-bottom: 1.5rem;
    }
    body.dark-mode .card { background: #1a1f2b; border-color: #2a3442; }
    .card h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .card h3 i { color: #2a7de1; }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid #f0f4fa;
    }
    body.dark-mode .info-item { border-bottom-color: #2a3442; }
    .info-item:last-child { border-bottom: none; }
    .info-label { color: #6b7d9c; font-weight: 500; }
    .info-value { font-weight: 600; }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th {
      text-align: left;
      padding: 0.7rem 0.8rem;
      font-weight: 600;
      color: #4a5b7a;
      border-bottom: 2px solid #eef2f8;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    body.dark-mode th { color: #b0c0d4; border-bottom-color: #2a3442; }
    td { padding: 0.7rem 0.8rem; border-bottom: 1px solid #eef2f8; }
    body.dark-mode td { border-bottom-color: #2a3442; }
    tr:last-child td { border-bottom: none; }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #eef2f8;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #2a7de1;
      border-radius: 10px;
    }

    .timeline {
      position: relative;
      padding-left: 28px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #eef2f8;
    }
    body.dark-mode .timeline::before { background: #2a3442; }
    .timeline-item {
      position: relative;
      margin-bottom: 1.2rem;
      padding-left: 12px;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -22px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2a7de1;
      border: 2px solid white;
      box-shadow: 0 0 0 2px #2a7de1;
    }
    body.dark-mode .timeline-item::before { border-color: #1a1f2b; }
    .timeline-date { font-size: 0.75rem; color: #8a9bb5; }
    .timeline-action { font-weight: 600; margin-top: 2px; }

    .empty-state { text-align: center; padding: 2rem; color: #8a9bb5; }

    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .toast {
      padding: 0.8rem 1.5rem;
      border-radius: 14px;
      background: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: slideIn 0.3s ease;
    }
    body.dark-mode .toast { background: #2a3442; color: #eef2f6; }
    .toast.success { border-left: 4px solid #10B981; }
    .toast.error { border-left: 4px solid #EF4444; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    @media (max-width: 768px) {
      .hamburger { display: block; }
      .main { margin-left: 0; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.closed { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .info-grid { grid-template-columns: 1fr; }
      .profile-header { flex-direction: column; text-align: center; }
    }
    .rtl { direction: rtl; }
    .rtl .sidebar nav a { flex-direction: row-reverse; }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-graduation-cap"></i>
      <span>Edu<small>Core</small></span>
    </div>
    <nav>
      <a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
      <a href="courses.html"><i class="fas fa-book-open"></i> Courses</a>
      <a href="lessons.html"><i class="fas fa-file-alt"></i> Lessons</a>
      <a href="lesson-upload.html"><i class="fas fa-upload"></i> Upload Lesson</a>
      <a href="live-classes.html"><i class="fas fa-video"></i> Live Classes</a>
      <a href="students.html" class="active"><i class="fas fa-users"></i> Students</a>
      <a href="revenue.html"><i class="fas fa-dollar-sign"></i> Revenue</a>
      <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
    </nav>
    <div class="sidebar-footer" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i> Logout
    </div>
  </aside>

  <div class="main" id="mainContent">
    <header class="navbar">
      <div style="display:flex; align-items:center; gap:1rem;">
        <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
        <h1 id="pageTitle">👤 Student Profile</h1>
      </div>
      <div class="navbar-actions">
        <div class="lang-dark">
          <button id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
          <button class="dark-toggle" id="darkToggle"><i class="fas fa-moon"></i></button>
        </div>
        <button><i class="fas fa-user-circle" style="font-size:1.6rem;"></i></button>
      </div>
    </header>

    <a href="students.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Students</a>

    <div id="profileContainer">
      <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><br>Loading profile...</div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, collection, getDocs, updateDoc, query, orderBy
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOBJ22snwOow8xfQnL2WmCusmyS8iWWlk",
      authDomain: "educore-c3b42.firebaseapp.com",
      projectId: "educore-c3b42",
      storageBucket: "educore-c3b42.firebasestorage.app",
      messagingSenderId: "750509780814",
      appId: "1:750509780814:web:f57bddff39c7668b3cf81f",
      measurementId: "G-LF317C03Q0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let TEACHER_ID = '';
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');

    const profileContainer = document.getElementById('profileContainer');
    let studentData = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = 'login.html'; }
      else {
        TEACHER_ID = user.uid;
        document.body.classList.add('auth-ready');
        if (studentId) loadStudentProfile(studentId);
        else profileContainer.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>No student ID provided. <a href="students.html">Go back</a></p></div>`;
      }
    });

    // Mobile sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    document.getElementById('hamburgerBtn').addEventListener('click', () => { sidebar.classList.add('open'); overlay.classList.add('show'); });
    overlay.addEventListener('click', () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); });
    document.querySelectorAll('.sidebar nav a').forEach(link => {
      link.addEventListener('click', () => { if (window.innerWidth <= 768) { sidebar.classList.remove('open'); overlay.classList.remove('show'); } });
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('Are you sure you want to logout?')) {
        signOut(auth).then(() => window.location.href = 'login.html');
      }
    });

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${msg}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    async function loadStudentProfile(id) {
      try {
        const base = `teachers/${TEACHER_ID}`;
        const docRef = doc(db, base, 'students', id);
        const docSnap = await getDoc(docRef);
        if (!docSnap.exists()) {
          profileContainer.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Student not found.</p></div>`;
          return;
        }
        studentData = { id: docSnap.id, ...docSnap.data() };

        const [coursesSnap, examsSnap, attendanceSnap, activitySnap] = await Promise.all([
          getDocs(collection(db, base, 'students', id, 'courses')),
          getDocs(collection(db, base, 'students', id, 'examResults')),
          getDocs(query(collection(db, base, 'students', id, 'attendance'), orderBy('date', 'desc'))),
          getDocs(query(collection(db, base, 'students', id, 'activityHistory'), orderBy('timestamp', 'desc')))
        ]);

        renderProfile(studentData, coursesSnap, examsSnap, attendanceSnap, activitySnap);
      } catch (error) {
        console.error(error);
        showToast('Failed to load profile', 'error');
        profileContainer.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error loading profile.</p></div>`;
      }
    }

    function renderProfile(student, coursesSnap, examsSnap, attendanceSnap, activitySnap) {
      const isBlocked = student.status === 'blocked';
      const enrollmentDate = student.enrollmentDate
        ? new Date(student.enrollmentDate.seconds ? student.enrollmentDate.seconds * 1000 : student.enrollmentDate).toLocaleDateString()
        : '—';
      const avatarContent = student.avatar
        ? `<img src="${student.avatar}" alt="${student.name}">`
        : (student.name ? student.name.charAt(0).toUpperCase() : '?');

      let html = `
        <div class="profile-header">
          <div class="profile-avatar">${avatarContent}</div>
          <div class="profile-info">
            <h2>${escapeHtml(student.name || 'Unknown')}</h2>
            <p>${escapeHtml(student.email || '')}</p>
            <div class="meta">
              <span class="badge ${isBlocked ? 'badge-danger' : 'badge-success'}">${isBlocked ? 'Blocked' : 'Active'}</span>
              <span style="color: #6b7d9c; font-size:0.9rem;"><i class="fas fa-calendar-alt"></i> ${enrollmentDate}</span>
            </div>
          </div>
          <div>
            <button class="btn ${isBlocked ? 'btn-primary' : 'btn-danger'}" id="toggleBlockBtn">
              <i class="fas ${isBlocked ? 'fa-unlock' : 'fa-lock'}"></i> ${isBlocked ? 'Unblock' : 'Block'}
            </button>
          </div>
        </div>

        <div class="card">
          <h3><i class="fas fa-info-circle"></i> Student Information</h3>
          <div class="info-grid">
            <div class="info-item"><span class="info-label">Name</span><span class="info-value">${escapeHtml(student.name || '—')}</span></div>
            <div class="info-item"><span class="info-label">Email</span><span class="info-value">${escapeHtml(student.email || '—')}</span></div>
            <div class="info-item"><span class="info-label">Phone</span><span class="info-value">${escapeHtml(student.phone || '—')}</span></div>
            <div class="info-item"><span class="info-label">Enrollment</span><span class="info-value">${enrollmentDate}</span></div>
          </div>
        </div>

        <div class="card">
          <h3><i class="fas fa-book-open"></i> Enrolled Courses</h3>
          ${renderCoursesTable(coursesSnap)}
        </div>

        <div class="card">
          <h3><i class="fas fa-file-alt"></i> Exam Results</h3>
          ${renderExamsTable(examsSnap)}
        </div>

        <div class="card">
          <h3><i class="fas fa-check-circle"></i> Attendance</h3>
          ${renderAttendanceTable(attendanceSnap)}
        </div>

        <div class="card">
          <h3><i class="fas fa-clock"></i> Activity History</h3>
          ${renderActivityTimeline(activitySnap)}
        </div>
      `;

      profileContainer.innerHTML = html;

      document.getElementById('toggleBlockBtn').addEventListener('click', async () => {
        const newStatus = isBlocked ? 'active' : 'blocked';
        try {
          await updateDoc(doc(db, 'teachers', TEACHER_ID, 'students', student.id), { status: newStatus });
          showToast(`Student ${newStatus === 'blocked' ? 'blocked' : 'unblocked'}.`, 'success');
          loadStudentProfile(student.id);
        } catch (error) { showToast('Error updating status.', 'error'); }
      });
    }

    function renderCoursesTable(snap) {
      if (snap.empty) return '<div class="empty-state">No courses enrolled.</div>';
      let rows = '';
      snap.forEach(doc => {
        const course = doc.data();
        rows += `
          <tr>
            <td><strong>${escapeHtml(course.courseName || 'Unnamed')}</strong></td>
            <td>${escapeHtml(course.instructor || '—')}</td>
            <td>
              <div style="display:flex;align-items:center;gap:0.5rem;">
                <div class="progress-bar" style="flex:1;"><div class="progress-fill" style="width:${course.progress || 0}%;"></div></div>
                <span style="font-size:0.85rem;">${course.progress || 0}%</span>
              </div>
            </td>
          </tr>`;
      });
      return `<div class="table-responsive"><table><thead><tr><th>Course</th><th>Instructor</th><th>Progress</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function renderExamsTable(snap) {
      if (snap.empty) return '<div class="empty-state">No exam results.</div>';
      let rows = '';
      snap.forEach(doc => {
        const exam = doc.data();
        const examDate = exam.date ? new Date(exam.date.seconds ? exam.date.seconds * 1000 : exam.date).toLocaleDateString() : '—';
        rows += `
          <tr>
            <td><strong>${escapeHtml(exam.examName || 'Unnamed')}</strong></td>
            <td>${exam.score ?? '—'} / ${exam.total ?? '—'}</td>
            <td>${examDate}</td>
          </tr>`;
      });
      return `<div class="table-responsive"><table><thead><tr><th>Exam</th><th>Score</th><th>Date</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function renderAttendanceTable(snap) {
      if (snap.empty) return '<div class="empty-state">No attendance records.</div>';
      let rows = '';
      snap.forEach(doc => {
        const att = doc.data();
        const attDate = att.date ? new Date(att.date.seconds ? att.date.seconds * 1000 : att.date).toLocaleDateString() : '—';
        const statusBadge = att.status === 'present' ? '<span class="badge badge-success">Present</span>' : '<span class="badge badge-danger">Absent</span>';
        rows += `
          <tr>
            <td>${attDate}</td>
            <td>${escapeHtml(att.className || '—')}</td>
            <td>${statusBadge}</td>
          </tr>`;
      });
      return `<div class="table-responsive"><table><thead><tr><th>Date</th><th>Class</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function renderActivityTimeline(snap) {
      if (snap.empty) return '<div class="empty-state">No activity recorded.</div>';
      let html = '<div class="timeline">';
      snap.forEach(doc => {
        const act = doc.data();
        const actTime = act.timestamp ? new Date(act.timestamp.seconds ? act.timestamp.seconds * 1000 : act.timestamp) : null;
        const timeStr = actTime ? actTime.toLocaleString() : '';
        html += `
          <div class="timeline-item">
            <div class="timeline-date">${timeStr}</div>
            <div class="timeline-action">${escapeHtml(act.action || '')}</div>
            ${act.details ? `<div style="color: #8a9bb5; font-size:0.8rem;">${escapeHtml(act.details)}</div>` : ''}
          </div>`;
      });
      html += '</div>';
      return html;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, m => {
        if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;';
        if (m === '"') return '&quot;'; if (m === "'") return '&#039;'; return m;
      });
    }

    // Language & Dark Mode
    let lang = 'en';
    const langToggle = document.getElementById('langToggle');
    const darkToggle = document.getElementById('darkToggle');
    const langLabel = document.getElementById('langLabel');
    const mainEl = document.getElementById('mainContent');

    langToggle.addEventListener('click', () => {
      lang = lang === 'en' ? 'ar' : 'en';
      langLabel.textContent = lang.toUpperCase();
      if (lang === 'ar') {
        document.getElementById('pageTitle').textContent = '👤 ملف الطالب';
        document.querySelector('.back-link').innerHTML = '<i class="fas fa-arrow-right"></i> العودة للطلاب';
        mainEl.classList.add('rtl');
      } else {
        document.getElementById('pageTitle').textContent = '👤 Student Profile';
        document.querySelector('.back-link').innerHTML = '<i class="fas fa-arrow-left"></i> Back to Students';
        mainEl.classList.remove('rtl');
      }
    });

    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      darkToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    });

    console.log('✅ Student Profile ready (Commander Pro structure).');
  </script>
</body>
</html>
